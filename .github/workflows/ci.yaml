name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq yq

      - name: Verify pins and CRDs
        run: |
          make verify-compat

      - name: Register guard
        run: |
          make verify-register

      - name: Unit tests
        run: |
          go test ./tests/unit -v

      - name: Envtest (schema dry-run)
        run: |
          # envtest assets are optional in CI image; skip when absent
          if [ -x /usr/local/kubebuilder/bin/etcd ]; then \
            export KUBEBUILDER_ASSETS=/usr/local/kubebuilder/bin; \
            make test-envtest; \
          else \
            echo "envtest assets not present; skipping"; \
          fi

  # Feature 002 (AGNTCY intent tier): Python agent tier — installs from the
  # lockfile (uv sync --frozen), lints, and tests under agents/.
  python-tier:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agents
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.20"

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Test (pytest)
        run: uv run pytest

  # Feature 002 (AGNTCY intent tier): operator chat surface under ui/ —
  # lockfile install, typecheck, and production build.
  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  # Feature 002 (AGNTCY intent tier): no credential literals may appear in the
  # tier's manifests or Dockerfiles (FR-016 policy; REVERSE.md Finding 4).
  no-credential-literals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan deploy/agents/ and docker/ for credential literals
        run: |
          set -euo pipefail
          # Known key/token formats (AWS, OpenAI-style, GitHub, Slack, PEM blocks)
          fmt_patterns='AKIA[0-9A-Z]{16}|sk-[A-Za-z0-9_-]{20,}|ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|xox[baprs]-[A-Za-z0-9-]{10,}|-----BEGIN [A-Z ]*PRIVATE KEY-----'
          if grep -RInE "$fmt_patterns" deploy/agents docker; then
            echo "FAIL: credential-format literal detected in deploy/agents/ or docker/" >&2
            exit 1
          fi
          # Hard-coded secret assignments in manifests/Dockerfiles/scripts.
          # Placeholders are allowed: ${...}, <...>, empty, or 'changeme' markers.
          if grep -RInE '(password|passwd|secret|api_?key|token)[[:space:]]*[:=][[:space:]]*["'"'"']?[A-Za-z0-9!@#$%^&*._-]{8,}' deploy/agents docker \
             | grep -vE '\$\{|<[^>]*>|changeme|CHANGE_ME|REPLACE_ME|generated|example' ; then
            echo "FAIL: hard-coded credential literal detected in deploy/agents/ or docker/" >&2
            exit 1
          fi
          echo "PASS: no credential literals in deploy/agents/ or docker/"
