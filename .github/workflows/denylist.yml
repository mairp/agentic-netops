name: Denylist Scan

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  denylist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ripgrep and coreutils
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep coreutils

      - name: Run repository-wide deny-list checks (SC-010, FR-020, FR-023, FR-032)
        shell: bash
        run: |
          set -euo pipefail

          fail=0

          # Helper: filter allowed contexts from ripgrep matches
          filter_allowed() {
            local matches="$1"
            # Normalize paths and allow citations in research.md and REVERSE.md
            matches=$(printf "%s" "${matches}" | sed -E 's#^\./##' | rg -v 'specs/.+/research\.md:' | rg -v '(^|.*/)REVERSE\.md:' || true)
            # Exclude other speckit feature spec directories (specs/002-*, specs/10-*, ...)
            # — owned by their own feature gates; their artifacts document subject systems.
            matches=$(printf "%s" "${matches}" | rg -v '^specs/00[2-9]-' | rg -v '^specs/[1-9][0-9]-' || true)
            # Exclude enforcement sources to avoid self-reference false positives
            matches=$(printf "%s" "${matches}" | rg -v '^(\.github/workflows/denylist\.yml|scripts/ci/denylist_policy\.sh|scripts/ci/supply_chain\.sh|scripts/ci/denylist_runtime_scan\.sh|tests/integration/cycles_runner\.sh):' || true)

            # Allow mentions in spec.md "Scope and interpretation" section and SC-010 success criterion only
            # Compute line ranges for the sections in the pinned spec
            local spec_path="specs/001-ainetops-sonic-evpn-fabric/spec.md"
            if [[ -f "$spec_path" ]]; then
              local start end sc010_start sc010_end
              start=$(awk '/^##\s+Scope and interpretation/{print NR; exit}' "$spec_path" || true)
              end=$(awk 'p && /^##\s+/{print NR; exit} /^##\s+Scope and interpretation/{p=1}' "$spec_path" || true)
              sc010_start=$(awk '/^- \*\*SC-010\*\*/{print NR; exit}' "$spec_path" || true)
              sc010_end=$(awk -v s="$sc010_start" 'NR > s && /^- \*\*SC-/{print NR; exit}' "$spec_path" || true)
              if [[ -z "$sc010_end" ]]; then sc010_end=999999; fi
              if [[ -n "${start}" && -n "${end}" ]]; then
                # Remove matches within allowed line ranges in spec.md
                matches=$(printf "%s" "${matches}" | awk -v s="$start" -v e="$end" -v s2="$sc010_start" -v e2="$sc010_end" -F: '!( $1=="'"$spec_path"'" && ( ($2>=s && $2<=e) || ($2>=s2 && $2<=e2) ) )')
              fi
            fi

            # Do NOT globally allow srl-telemetry-lab — handle it in its own scoped check below

            printf "%s" "${matches}"
          }

          echo "::group::Migration boundary terms (FR-020)"
          MIG_PATTERN='\\b(cisco|crosswork|nso|cnc|proprietary\\s+ned|proprietary\\s+neds|ai-network-services-devnet-2606|devnet-2606)\\b'
          if git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            MIG_MATCHES=$(git ls-files -z | rg -z -v '^(vendor/|\.wiggum/|scripts/ci/)' | xargs -0 rg -i -n -e "$MIG_PATTERN" || true)
          else
            MIG_MATCHES=$(rg -i -n --hidden --no-ignore -g '!*/.git/*' -g '!vendor/**' -g '!.wiggum/**' -g '!scripts/ci/**' -e "$MIG_PATTERN" . || true)
          fi
          MIG_VIOLATIONS=$(filter_allowed "$MIG_MATCHES")
          if [[ -n "$MIG_VIOLATIONS" ]]; then
            echo "::error title=Migration boundary term(s) found outside allowed contexts::${MIG_VIOLATIONS}"
            fail=1
          fi
          echo "::endgroup::"

          echo "::group::Visualization boundary terms (FR-032)"
          VIS_PATTERN='\\b(sr[ -]?linux|nokia_srlinux)\\b|ghcr\\.io/nokia/srlinux'
          if git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            VIS_MATCHES=$(git ls-files -z | rg -z -v '^(vendor/|\.wiggum/|scripts/ci/)' | xargs -0 rg -i -n -e "$VIS_PATTERN" || true)
          else
            VIS_MATCHES=$(rg -i -n --hidden --no-ignore -g '!*/.git/*' -g '!vendor/**' -g '!.wiggum/**' -g '!scripts/ci/**' -e "$VIS_PATTERN" . || true)
          fi
          VIS_VIOLATIONS=$(filter_allowed "$VIS_MATCHES")
          if [[ -n "$VIS_VIOLATIONS" ]]; then
            echo "::error title=SR Linux mention(s) found outside allowed contexts::${VIS_VIOLATIONS}"
            fail=1
          fi
          echo "::endgroup::"

          echo "::group::Placement boundary (FR-023): Compose/standalone indicators"
          PL_PATTERN='(docker-compose|docker\\s+compose|compose\\.ya?ml|standalone\\s+container|standalone\\s+deployment)'
          if git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            PL_MATCHES=$(git ls-files -z | rg -z -v '^(vendor/|\.wiggum/|scripts/ci/)' | xargs -0 rg -i -n -e "$PL_PATTERN" || true)
          else
            PL_MATCHES=$(rg -i -n --hidden --no-ignore -g '!*/.git/*' -g '!vendor/**' -g '!.wiggum/**' -g '!scripts/ci/**' -e "$PL_PATTERN" . || true)
          fi
          PL_VIOLATIONS=$(filter_allowed "$PL_MATCHES")
          if [[ -n "$PL_VIOLATIONS" ]]; then
            echo "::error title=Disallowed placement mention(s) found outside allowed contexts::${PL_VIOLATIONS}"
            fail=1
          fi
          echo "::endgroup::"

          echo "::group::Visualization reference repository exception (srl-telemetry-lab only in allowed contexts)"
          SRLTL_PATTERN='srl-telemetry-lab'
          if git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            SRLTL_MATCHES=$(git ls-files -z | rg -z -v '^(vendor/|\.wiggum/|scripts/ci/)' | xargs -0 rg -i -n -e "$SRLTL_PATTERN" || true)
          else
            SRLTL_MATCHES=$(rg -i -n --hidden --no-ignore -g '!*/.git/*' -g '!vendor/**' -g '!.wiggum/**' -g '!scripts/ci/**' -e "$SRLTL_PATTERN" . || true)
          fi
          # Allowed contexts: spec.md Scope and interpretation section, SC-010 in spec.md, specs/**/research.md, REVERSE.md, and README.md line stating presentation-only reference
          ALLOWED_SPECS_SCOPE=$(awk '/^##\s+Scope and interpretation/{print NR; exit}' specs/001-ainetops-sonic-evpn-fabric/spec.md || true)
          ALLOWED_SPECS_SCOPE_END=$(awk 'p && /^##\s+/{print NR; exit} /^##\s+Scope and interpretation/{p=1}' specs/001-ainetops-sonic-evpn-fabric/spec.md || true)
          # Also allow SC-010 success criterion lines in spec.md
          ALLOWED_SC010_START=$(awk '/^- \*\*SC-010\*\*/{print NR; exit}' specs/001-ainetops-sonic-evpn-fabric/spec.md || true)
          ALLOWED_SC010_END=$(awk -v s="$ALLOWED_SC010_START" 'NR > s && /^- \*\*SC-/{print NR; exit}' specs/001-ainetops-sonic-evpn-fabric/spec.md || true)
          if [[ -z "$ALLOWED_SC010_END" ]]; then ALLOWED_SC010_END=999999; fi
          SRLTL_VIOLATIONS=$(printf "%s" "${SRLTL_MATCHES}" \
            | awk -F: -v s="$ALLOWED_SPECS_SCOPE" -v e="$ALLOWED_SPECS_SCOPE_END" -v s2="$ALLOWED_SC010_START" -v e2="$ALLOWED_SC010_END" '!( $1 ~ /^specs\/001-ainetops-sonic-evpn-fabric\/spec.md$/ && ( ($2>=s && $2<=e) || ($2>=s2 && $2<=e2) ) )' \
            | rg -v '^specs/.+/research\.md:' \
            | rg -v '(^|.*/)REVERSE\.md:' \
            | rg -v '^specs/00[2-9]-' \
            | rg -v '^specs/[1-9][0-9]-' \
            | rg -v '^README\.md:.*visualization/presentation reference only' \
            | rg -v '^(\.github/workflows/denylist\.yml|scripts/ci/denylist_policy\.sh|scripts/ci/denylist_runtime_scan\.sh|tests/integration/cycles_runner\.sh):' || true)
          if [[ -n "$SRLTL_VIOLATIONS" ]]; then
            echo "::error title=srl-telemetry-lab mention(s) found outside allowed contexts::${SRLTL_VIOLATIONS}"
            fail=1
          fi
          echo "::endgroup::"

          if [[ "$fail" -ne 0 ]]; then
            echo "Deny-list checks failed" >&2
            exit 1
          fi
          echo "All deny-list checks passed"
