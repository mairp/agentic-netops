spec:
  description: Migrated service irb1 (mac-vrf)
  bridgeDomains:
  - name: bd-irb1
    vlan: 20
    l2vni: 10401
    evpn:
      routeTargets:
        import:
        - "65000:401"
        export:
        - "65000:401"
    irb:
      vrf: vrf-irb1
      gatewayIPv4: 10.0.20.1/24
      gatewayIPv6: 2001:db8:20::1/64
  routers:
  - name: vrf-irb1
    rd: 65000:401
    routeTargets:
      import:
      - "65000:401"
      export:
      - "65000:401"
    l3vni: 14001
  attachments:
  - node: leaf01
    vlan: 20
    attachment: client01
  - node: leaf02
    vlan: 20
    attachment: client02
