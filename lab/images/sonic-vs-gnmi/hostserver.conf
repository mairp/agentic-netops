# v2 addition: the GCU dbus provider and its bus must actually run.
# The v1 image (sha256:c04b9ed…) already carries /usr/bin/dbus-daemon and
# /usr/local/bin/sonic-host-server + host_modules/, but nothing started them,
# so gNMI Set reached GCU over a system bus that did not exist and died with
# "connect: no such file or directory" (docs/SRV6_GNMI_CAPABILITY_FINDINGS.md §4.1).
[program:dbus]
command=/bin/bash -c "mkdir -p /var/run/dbus && exec /usr/bin/dbus-daemon --system --nofork --nopidfile"
priority=90
autostart=true
autorestart=true
startsecs=1
startretries=100
stdout_logfile=/var/log/dbus.log
stdout_logfile_maxbytes=2MB
stderr_logfile=/var/log/dbus-err.log
stderr_logfile_maxbytes=2MB

[program:host-server]
command=/usr/bin/python3 /usr/local/bin/sonic-host-server
priority=91
autostart=true
autorestart=true
startsecs=2
startretries=100
stdout_logfile=/var/log/host-server.log
stdout_logfile_maxbytes=2MB
stderr_logfile=/var/log/host-server-err.log
stderr_logfile_maxbytes=2MB
