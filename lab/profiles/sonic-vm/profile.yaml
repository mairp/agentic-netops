# Agentic NetOps SONiC lab profile: sonic-vm (conformance overlay)
profile: sonic-vm
kind: sonic-vm
image: local/sonic-vm:202505
runtime:
  privileged: true
  devices:
    - /dev/kvm
bootstrap:
  path: lab/profiles/sonic-vm/bootstrap
  files:
    - lab/profiles/sonic-vm/bootstrap/init-sonic-bootstrap.sh
    - lab/profiles/sonic-vm/bootstrap/install-gnmi-certs.sh
    - lab/profiles/sonic-vm/bootstrap/gnmi_config_db.json
notes: |
  Requires KVM/nested virtualization. Deploys lab/topology.sonic-vm.clab.yml
  (containerlab native sonic-vm kind, vrnetlab QEMU launcher). Bootstrap is
  VM-aware: clab::bootstrap execs init-sonic-bootstrap.sh in the launcher,
  which provisions the guest over SSH (TLS certs, TELEMETRY/gNMI enablement
  with TLS, gNMI Linux user, persistence via `config save`). Limited to TLS +
  gNMI enablement; the EVPN/SRv6 tests program configuration via gNMI during
  qualification. Build the image with scripts/build-sonic-vm.sh and keep the
  digest pinned in versions.lock.yaml (authoritative; this file is
  informational and is not consumed by deploy tooling).
