# fabric.yaml — single source for the sonic-vm conformance lab's node identity,
# fabric link addressing and SRv6 locators (T125).
#
# Sources of truth, by section of specs/004-srv6-service-requests/data-model.md:
#   - node identity (ASN, loopbacks, router-id): §7 — spines 65000, leaf01 65101,
#     leaf02 65102; loopbacks 10.0.0.<11,12,21,22> and 2001:db8:ff::<11,12,21,22>;
#     router-id is the IPv4 loopback address.
#   - fabric link addressing: the same /31 (IPv4) and /127 (IPv6) plan the
#     sonic-vs bootstrap carries (lab/profiles/sonic-vs/bootstrap/configure-fabric-bgp.sh),
#     so both profiles describe the same fabric.
#   - locators: §8.2 — one locator block per node, fcbb:bbbb:<n>::/48
#     (spine01=1, spine02=2, leaf01=3, leaf02=4); the CONFIG_DB
#     SRV6_MY_LOCATORS row carries the bare address (spike-locator-* write
#     class), the origination (Loopback0 /128, zebra static, bgpd network)
#     carries the /48.
#
# Consumers read this file with python3+yaml on the HOST (the sonic-vm launcher
# containers have no jq/yaml); lab/profiles/sonic-vm/bootstrap/configure-fabric.sh
# is the only writer. Guest port names are the SONiC EthernetN names
# (lab/profiles/sonic-vm/port-map.json records the launcher-if <-> EthernetN map).

fabric:
  # Address families carried on every fabric link.
  v4_prefix_len: 31
  v6_prefix_len: 127
  # Kernel route metric that beats the BGP proto-20 route for the locator /48
  # pins (spike-locator-reach: plain ECMP lets the symmetric flow hash pick the
  # arrival leg and self-loop a spine; metric 5 removes the loop).
  locator_pin_metric: 5

nodes:
  spine01:
    role: spine
    asn: 65000
    loopback4: 10.0.0.11/32
    loopback6: 2001:db8:ff::11/128
    router_id: 10.0.0.11
    locator: fcbb:bbbb:1::/48
    links:
      - port: Ethernet0
        v4: 10.1.0.0/31
        v6: 2001:db8:1::3/127
        peer: leaf01
        peer_port: Ethernet0
        peer_v4: 10.1.0.1/31
        peer_v6: 2001:db8:1::2/127
      - port: Ethernet4
        v4: 10.1.0.2/31
        v6: 2001:db8:1::5/127
        peer: leaf02
        peer_port: Ethernet0
        peer_v4: 10.1.0.3/31
        peer_v6: 2001:db8:1::4/127

  spine02:
    role: spine
    asn: 65000
    loopback4: 10.0.0.12/32
    loopback6: 2001:db8:ff::12/128
    router_id: 10.0.0.12
    locator: fcbb:bbbb:2::/48
    links:
      - port: Ethernet0
        v4: 10.1.0.4/31
        v6: 2001:db8:2::3/127
        peer: leaf01
        peer_port: Ethernet4
        peer_v4: 10.1.0.5/31
        peer_v6: 2001:db8:2::2/127
      - port: Ethernet4
        v4: 10.1.0.6/31
        v6: 2001:db8:2::5/127
        peer: leaf02
        peer_port: Ethernet4
        peer_v4: 10.1.0.7/31
        peer_v6: 2001:db8:2::4/127

  leaf01:
    role: leaf
    asn: 65101
    loopback4: 10.0.0.21/32
    loopback6: 2001:db8:ff::21/128
    router_id: 10.0.0.21
    locator: fcbb:bbbb:3::/48
    links:
      - port: Ethernet0
        v4: 10.1.0.1/31
        v6: 2001:db8:1::2/127
        peer: spine01
        peer_port: Ethernet0
        peer_v4: 10.1.0.0/31
        peer_v6: 2001:db8:1::3/127
      - port: Ethernet4
        v4: 10.1.0.5/31
        v6: 2001:db8:2::2/127
        peer: spine02
        peer_port: Ethernet0
        peer_v4: 10.1.0.4/31
        peer_v6: 2001:db8:2::3/127

  leaf02:
    role: leaf
    asn: 65102
    loopback4: 10.0.0.22/32
    loopback6: 2001:db8:ff::22/128
    router_id: 10.0.0.22
    locator: fcbb:bbbb:4::/48
    links:
      - port: Ethernet0
        v4: 10.1.0.3/31
        v6: 2001:db8:1::4/127
        peer: spine01
        peer_port: Ethernet4
        peer_v4: 10.1.0.2/31
        peer_v6: 2001:db8:1::5/127
      - port: Ethernet4
        v4: 10.1.0.7/31
        v6: 2001:db8:2::4/127
        peer: spine02
        peer_port: Ethernet4
        peer_v4: 10.1.0.6/31
        peer_v6: 2001:db8:2::5/127

# BGP session expectation per role, per address family, used by the underlay
# wait and by tests/integration/fabric_baseline.sh --underlay: a leaf peers
# with the two spines (eBGP); a spine with the two leaves (eBGP) plus the
# spine-spine iBGP peer over the loopbacks (no direct spine-spine link; the
# spines share AS 65000, so the leaf-facing neighbors carry allowas-in 1 and
# the iBGP session is update-sourced from the loopbacks — underlay-apply write
# class, re-asserted live on every apply).
expected_sessions:
  spine: 3
  leaf: 2
