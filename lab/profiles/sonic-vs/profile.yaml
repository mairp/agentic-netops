# Agentic NetOps SONiC lab profile: sonic-vs
profile: sonic-vs
kind: sonic-vs
image: localhost:5000/sonic-vs-gnmi:202505-v1@sha256:d1043aed28c98071c997a46d7e9e47823abacb06c31c068183541f8b5b5529e8
bootstrap:
  # Limited bootstrap: management, TLS, gNMI only; persistent config under /etc/sonic
  path: lab/profiles/sonic-vs/bootstrap
  files:
    - lab/profiles/sonic-vs/bootstrap/init-sonic-bootstrap.sh
    - lab/profiles/sonic-vs/bootstrap/install-gnmi-certs.sh
    - lab/profiles/sonic-vs/bootstrap/gnmi_config_db.json
persistence:
  etc_sonic_volume: agentic-netops-${clab-node-name}-etc-sonic
notes: |
  This immutable profile is used for fast qualification. No underlay or overlay control-plane
  is configured by bootstrap; only gNMI/TLS is enabled and /etc/sonic persists across restarts.

  SRv6/gNMI-qualified as of 2026-09-04. The image is the official clean 202505
  sonic-vs build 1207609 with a
  sonic-gnmi telemetry server layered in (lab/images/sonic-vs-gnmi/); it carries
  /usr/sbin/telemetry, supervisord program:telemetry, and sonic-srv6.yang, so
  scripts/lib/qualify.sh has a live gNMI endpoint to gate on. The previously pinned image
  (versions.lock.yaml sonic_vs_base, a build frozen since 2022-01) shipped no gNMI server
  at all, which is why the capability gate failed closed against it — that was a property
  of the image, not a misconfiguration.

  The compatibility layer adds supervisord programs for dbus-daemon and sonic-host-server
  and isolates the telemetry binary's 202605 libraries from SONiC's own daemons
  (recipe: lab/images/sonic-vs-gnmi/Dockerfile.compat). Bootstrap also sets
  DEVICE_METADATA.localhost.switch_type=npu (the YANG enum rejects "switch", and GCU
  validates the whole CONFIG_DB before any patch) and installs TLS certs with ".cer"
  suffixes (sonic-telemetry YANG pattern; a ".crt" path made every GCU write fail).
  See docs/SRV6_GNMI_CAPABILITY_FINDINGS.md §4.1 and §7 (D1–D4, all resolved).
