all:
  vars:
    # The generated inventory is assumed to be used from the clab host.
    # Hence no http proxy should be used. Therefore we make sure the http
    # module does not attempt using any global http proxy.
    ansible_httpapi_use_proxy: false
  children:
    linux:
      hosts:
        clab-ainetops-fabric-client01:
          ansible_host: 172.31.0.101
        clab-ainetops-fabric-client02:
          ansible_host: 172.31.0.102
        clab-ainetops-fabric-srv6-client01:
          ansible_host: 172.31.0.111
        clab-ainetops-fabric-srv6-client02:
          ansible_host: 172.31.0.112
    sonic-vs:
      hosts:
        clab-ainetops-fabric-leaf01:
          ansible_host: 172.31.0.21
        clab-ainetops-fabric-leaf02:
          ansible_host: 172.31.0.22
        clab-ainetops-fabric-spine01:
          ansible_host: 172.31.0.11
        clab-ainetops-fabric-spine02:
          ansible_host: 172.31.0.12
