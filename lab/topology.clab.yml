name: ainetops-fabric
mgmt:
  network: ainetops-mgmt  # external AINETOPS-owned Docker network (created by scripts/provision.sh)
  ipv4-subnet: 172.31.0.0/16  # reused management subnet (no overlap with pod/service per preflight)
  mtu: 9216

# Ownership labels are applied by scripts/provision.sh / scripts/off.sh at the Docker
# network and container level (docker network create --label, node labels below),
# which is how off.sh resolves its exact targets without broad globs. Containerlab
# 0.79 removed the mgmt-level labels/annotations fields, so they are not declared here.
# SONiC /etc/sonic persistence uses per-node named volumes (deterministic names,
# removed explicitly by scripts/lib/containerlab.sh destroy).

topology:
  kinds:
    sonic-vs:
      # Containerlab does not have a special kind for SONiC; we use a linux kind with SONiC images
      kind: linux
      image: localhost:5000/sonic-vs-gnmi:202605-v2@sha256:30c294564ca75a020859c26b8c80494126f16c857907cc31498bbc0fd29c253e
      env:
        TZ: UTC

  defaults:
    labels:
      ainetops.owner: ainetops
      ainetops.topology: sonic-evpn

  nodes:
    spine01:
      kind: sonic-vs
      mgmt-ipv4: 172.31.0.11
      volumes:
        - ainetops-spine01-etc-sonic:/etc/sonic
      labels:
        role: spine
        asn: "65000"
    spine02:
      kind: sonic-vs
      mgmt-ipv4: 172.31.0.12
      volumes:
        - ainetops-spine02-etc-sonic:/etc/sonic
      labels:
        role: spine
        asn: "65000"
    leaf01:
      kind: sonic-vs
      mgmt-ipv4: 172.31.0.21
      volumes:
        - ainetops-leaf01-etc-sonic:/etc/sonic
      labels:
        role: leaf
        asn: "65101"
    leaf02:
      kind: sonic-vs
      mgmt-ipv4: 172.31.0.22
      volumes:
        - ainetops-leaf02-etc-sonic:/etc/sonic
      labels:
        role: leaf
        asn: "65102"
    client01:
      kind: linux
      image: localhost:5000/linux-net:202605@sha256:c1df8a372168f5b7d3c2c50265fa99d5eb5b6deacdbb31b327a52376a74c6d7f
      mgmt-ipv4: 172.31.0.101
      labels:
        role: evpn-client
        attach: leaf01
      exec:
        # both EVPN clients share the bridged Vlan100 subnet (192.0.2.0/24) so
        # Type-2 MAC/IP reachability is exercisable; /31s would put them in
        # different subnets and break bridged L2 reachability
        - ip link set dev eth1 up
        - ip addr add 192.0.2.11/24 dev eth1
        - ip -6 addr add 2001:db8:9::11/64 dev eth1
    client02:
      kind: linux
      image: localhost:5000/linux-net:202605@sha256:c1df8a372168f5b7d3c2c50265fa99d5eb5b6deacdbb31b327a52376a74c6d7f
      mgmt-ipv4: 172.31.0.102
      labels:
        role: evpn-client
        attach: leaf02
      exec:
        - ip link set dev eth1 up
        - ip addr add 192.0.2.21/24 dev eth1
        - ip -6 addr add 2001:db8:9::21/64 dev eth1
    srv6-client01:
      kind: linux
      image: localhost:5000/linux-srv6:202605@sha256:c1df8a372168f5b7d3c2c50265fa99d5eb5b6deacdbb31b327a52376a74c6d7f
      mgmt-ipv4: 172.31.0.111
      labels:
        role: srv6-client
        attach: leaf01
      exec:
        - ip link set dev eth1 up
        - ip addr add 192.0.2.31/31 dev eth1
        - ip -6 addr add 2001:db8:3::31/127 dev eth1
    srv6-client02:
      kind: linux
      image: localhost:5000/linux-srv6:202605@sha256:c1df8a372168f5b7d3c2c50265fa99d5eb5b6deacdbb31b327a52376a74c6d7f
      mgmt-ipv4: 172.31.0.112
      labels:
        role: srv6-client
        attach: leaf02
      exec:
        - ip link set dev eth1 up
        - ip addr add 192.0.2.41/31 dev eth1
        - ip -6 addr add 2001:db8:4::41/127 dev eth1

  links:
    # Spine-leaf fabric (explicit interface mapping) — MTU applies per link
    - endpoints: [spine01:eth1, leaf01:eth1]
      mtu: 9216
    - endpoints: [spine01:eth2, leaf02:eth1]
      mtu: 9216
    - endpoints: [spine02:eth1, leaf01:eth2]
      mtu: 9216
    - endpoints: [spine02:eth2, leaf02:eth2]
      mtu: 9216

    # Leaf to EVPN Linux endpoints
    - endpoints: [leaf01:eth3, client01:eth1]
      mtu: 9216
    - endpoints: [leaf02:eth3, client02:eth1]
      mtu: 9216

    # Leaf to SRv6 Linux endpoints (one per leaf)
    - endpoints: [leaf01:eth4, srv6-client01:eth1]
      mtu: 9216
    - endpoints: [leaf02:eth4, srv6-client02:eth1]
      mtu: 9216
