name: agentic-netops-fabric
mgmt:
  network: agentic-netops-mgmt  # external Agentic NetOps-owned Docker network (created by scripts/provision.sh)
  ipv4-subnet: 172.31.0.0/16  # reused management subnet (no overlap with pod/service per preflight)
  mtu: 9216

# Ownership labels are applied by scripts/provision.sh / scripts/off.sh at the Docker
# network and container level (docker network create --label, node labels below),
# which is how off.sh resolves its exact targets without broad globs. Containerlab
# 0.79 removed the mgmt-level labels/annotations fields, so they are not declared here.
# SR Linux persists its own configuration inside the container filesystem, and the
# underlay/overlay comes from the per-node startup-config below, so this topology
# declares no named volumes: `containerlab deploy --reconfigure` re-applies the
# startup-config and is the single source of node state.

topology:
  kinds:
    nokia_srlinux:
      image: ghcr.io/nokia/srlinux:26.7.2@sha256:0096fe3ebcafabb7253492e2060425fe027a168e0e066766d1e85efbb0b48be8
      type: ixrd2l

  defaults:
    labels:
      agentic-netops.owner: agentic-netops
      agentic-netops.topology: srlinux-evpn

  nodes:
    # Fabric nodes. startup-config files carry SR Linux CLI `set /` statements
    # (interfaces, dual-stack eBGP underlay, iBGP EVPN overlay, gNMI server, and —
    # on the leaves — the bootstrap mac-vrf/ip-vrf). containerlab applies them on
    # deploy and on --reconfigure; nothing is configured by a post-boot shell hook.
    spine01:
      kind: nokia_srlinux
      mgmt-ipv4: 172.31.0.11
      startup-config: profiles/srlinux/config/spine01.cfg
      labels:
        role: spine
        asn: "65000"
    spine02:
      kind: nokia_srlinux
      mgmt-ipv4: 172.31.0.12
      startup-config: profiles/srlinux/config/spine02.cfg
      labels:
        role: spine
        asn: "65000"
    leaf01:
      kind: nokia_srlinux
      mgmt-ipv4: 172.31.0.21
      startup-config: profiles/srlinux/config/leaf01.cfg
      labels:
        role: leaf
        asn: "65101"
    leaf02:
      kind: nokia_srlinux
      mgmt-ipv4: 172.31.0.22
      startup-config: profiles/srlinux/config/leaf02.cfg
      labels:
        role: leaf
        asn: "65102"
    client01:
      kind: linux
      image: localhost:5000/linux-net:202605@sha256:c1df8a372168f5b7d3c2c50265fa99d5eb5b6deacdbb31b327a52376a74c6d7f
      mgmt-ipv4: 172.31.0.101
      labels:
        role: evpn-client
        attach: leaf01
      exec:
        # both EVPN clients share the bridged vlan100 mac-vrf subnet (192.0.2.0/24)
        # so Type-2 MAC/IP reachability is exercisable; /31s would put them in
        # different subnets and break bridged L2 reachability
        - ip link set dev eth1 up
        - ip addr add 192.0.2.11/24 dev eth1
        - ip -6 addr add 2001:db8:9::11/64 dev eth1
    client02:
      kind: linux
      image: localhost:5000/linux-net:202605@sha256:c1df8a372168f5b7d3c2c50265fa99d5eb5b6deacdbb31b327a52376a74c6d7f
      mgmt-ipv4: 172.31.0.102
      labels:
        role: evpn-client
        attach: leaf02
      exec:
        - ip link set dev eth1 up
        - ip addr add 192.0.2.21/24 dev eth1
        - ip -6 addr add 2001:db8:9::21/64 dev eth1
    # WAN-side clients on the leaves' ethernet-1/4 (the `wan1` logical attachment
    # the ip-vrf construct renders on). The image name is kept for provenance;
    # SRv6 has no data plane on this fabric and is declared not-applicable.
    srv6-client01:
      kind: linux
      image: localhost:5000/linux-srv6:202605@sha256:c1df8a372168f5b7d3c2c50265fa99d5eb5b6deacdbb31b327a52376a74c6d7f
      mgmt-ipv4: 172.31.0.111
      labels:
        role: wan-client
        attach: leaf01
      exec:
        - ip link set dev eth1 up
        - ip addr add 192.0.2.31/31 dev eth1
        - ip -6 addr add 2001:db8:3::31/127 dev eth1
    srv6-client02:
      kind: linux
      image: localhost:5000/linux-srv6:202605@sha256:c1df8a372168f5b7d3c2c50265fa99d5eb5b6deacdbb31b327a52376a74c6d7f
      mgmt-ipv4: 172.31.0.112
      labels:
        role: wan-client
        attach: leaf02
      exec:
        - ip link set dev eth1 up
        - ip addr add 192.0.2.41/31 dev eth1
        - ip -6 addr add 2001:db8:4::41/127 dev eth1

  links:
    # Spine-leaf fabric (explicit interface mapping) — MTU applies per link.
    # e1-N is containerlab's short form for SR Linux ethernet-1/N.
    - endpoints: [spine01:e1-1, leaf01:e1-1]
      mtu: 9216
    - endpoints: [spine01:e1-2, leaf02:e1-1]
      mtu: 9216
    - endpoints: [spine02:e1-1, leaf01:e1-2]
      mtu: 9216
    - endpoints: [spine02:e1-2, leaf02:e1-2]
      mtu: 9216

    # Leaf to EVPN Linux endpoints (bootstrap mac-vrf vlan100, untagged)
    - endpoints: [leaf01:e1-3, client01:eth1]
      mtu: 9216
    - endpoints: [leaf02:e1-3, client02:eth1]
      mtu: 9216

    # Leaf to WAN Linux endpoints (the `wan1` attachment of the ip-vrf construct)
    - endpoints: [leaf01:e1-4, srv6-client01:eth1]
      mtu: 9216
    - endpoints: [leaf02:e1-4, srv6-client02:eth1]
      mtu: 9216
