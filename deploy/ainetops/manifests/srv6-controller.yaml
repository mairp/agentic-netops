# AINETOPS SRv6 controller placeholder Deployment and Service (T023)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ainetops-srv6-controller
  namespace: ainetops-system
  labels:
    app.kubernetes.io/name: ainetops-srv6-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ainetops-srv6-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ainetops-srv6-controller
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: ainetops-srv6-controller
      containers:
      - name: srv6-controller
        image: ghcr.io/ainetops/ainetops-srv6-controller@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        args: ["--metrics-bind=:8081", "--health-probe-bind=:8082"]
        ports:
        - name: http
          containerPort: 8081
        env:
        - name: OTEL_SERVICE_NAME
          value: ainetops-srv6-controller
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otel-collector.ainetops-system:4318
        readinessProbe:
          httpGet: { path: /readyz, port: 8082 }
          initialDelaySeconds: 5
        livenessProbe:
          httpGet: { path: /healthz, port: 8082 }
          initialDelaySeconds: 10
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: ainetops-srv6-controller
  namespace: ainetops-system
spec:
  selector:
    app.kubernetes.io/name: ainetops-srv6-controller
  ports:
  - name: http
    port: 8081
    targetPort: 8081
