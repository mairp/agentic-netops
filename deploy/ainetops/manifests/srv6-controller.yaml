# AINETOPS SRv6 controller placeholder Deployment and Service (T023)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ainetops-srv6-controller
  namespace: ainetops-system
  labels:
    app.kubernetes.io/name: ainetops-srv6-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ainetops-srv6-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ainetops-srv6-controller
    spec:
      serviceAccountName: ainetops-controller
      containers:
      - name: srv6-controller
        image: ghcr.io/ainetops/ainetops-srv6-controller@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        args: ["--metrics-bind=:8081"]
        ports:
        - name: http
          containerPort: 8081
        readinessProbe:
          httpGet: { path: /readyz, port: 8081 }
          initialDelaySeconds: 5
        livenessProbe:
          httpGet: { path: /healthz, port: 8081 }
          initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ainetops-srv6-controller
  namespace: ainetops-system
spec:
  selector:
    app.kubernetes.io/name: ainetops-srv6-controller
  ports:
  - name: http
    port: 8081
    targetPort: 8081
