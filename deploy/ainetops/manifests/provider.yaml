# AINETOPS SONiC provider placeholder Deployment and Service (T023)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ainetops-sonic-provider
  namespace: ainetops-system
  labels:
    app.kubernetes.io/name: ainetops-sonic-provider
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ainetops-sonic-provider
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ainetops-sonic-provider
    spec:
      serviceAccountName: ainetops-controller
      containers:
      - name: provider
        image: ghcr.io/ainetops/ainetops-sonic-provider@sha256:9999999999999999999999999999999999999999999999999999999999999999
        args: ["--metrics-bind=:8080"]
        ports:
        - name: http
          containerPort: 8080
        readinessProbe:
          httpGet: { path: /readyz, port: 8080 }
          initialDelaySeconds: 5
        livenessProbe:
          httpGet: { path: /healthz, port: 8080 }
          initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ainetops-sonic-provider
  namespace: ainetops-system
spec:
  selector:
    app.kubernetes.io/name: ainetops-sonic-provider
  ports:
  - name: http
    port: 8080
    targetPort: 8080
