# T044 [P] [US1] Bridged L2 tenant example with two cross-leaf attachments, VLAN, L2VNI, RD/RT, and Type 2/3 expectations
apiVersion: network.kubenet.dev/v1alpha1
kind: Network
metadata:
  name: tenant-a-l2-bridged
  namespace: kubenet-system
spec:
  description: Tenant A bridged L2 domain across two leaves
  bridgeDomains:
    - name: bd-blue
      vlan: 10
      l2vni: 10010
      evpn:
        routeTargets:
          import: ["65000:100"]
          export: ["65000:100"]
  attachments:
    - node: leaf01
      vlan: 10
      attachment: client01
    - node: leaf02
      vlan: 10
      attachment: client02
