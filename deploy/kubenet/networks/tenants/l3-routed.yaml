# T045 [P] [US1] Routed L3 tenant example with VRF, L3VNI, RD/RT, prefixes, and Type-5 expectations
apiVersion: network.kubenet.dev/v1alpha1
kind: Network
metadata:
  name: tenant-a-l3-routed
  namespace: kubenet-system
spec:
  description: Tenant A routed VRF with L3VNI and Type-5 prefix export
  routers:
    - name: vrf-tenant-a
      rd: "65000:100"
      routeTargets:
        import: ["65000:100"]
        export: ["65000:100"]
      l3vni: 10100
      prefixes:
        - 10.0.10.0/24
        - 2001:db8:10::/64
  attachments:
    - node: leaf01
      vrf: vrf-tenant-a
      attachment: client01
    - node: leaf02
      vrf: vrf-tenant-a
      attachment: client02
