# T345: SRv6 service-ID and client-addressing pools (data-model.md §8.1).
#
# The three static `id.kuid.dev` Claim objects this file used to carry are
# gone (plan 8-01): nothing ever allocated from them, and locators are
# bootstrap-owned (data-model §4/§8.2) so no service ever claims one here.
#
# Pool 1 — srv6-service-ids, integer service ids 1..999 (§8.1)
#   NO index object is declared for this pool, on measured evidence: the
#   pinned kuid-server refuses EVERY write to genidindices.genid.be.kuid.dev
#   — `kubectl apply --dry-run=server` and a real `kubectl apply` both end in
#   `Error from server (ServiceUnavailable): ... post
#   genidindices.genid.be.kuid.dev` (reproduced live 2026-10-16). The defect
#   is the pinned server's GENID spec conversion, documented in
#   docs/CLUSTER_REBUILD_FINDINGS.md §2 ("GENIDIndex | fails" — unsupported
#   uint64 in structured-merge-diff, and "invalid GENID Type" for every
#   documented type value; `VLANIndex | works`). An index the server refuses
#   to store would be a pool that exists only on paper, so declaring one
#   would hide a real failure behind a manifest that can never apply.
#   The pool's honest authority is instead the atomic Kubernetes-Lease
#   fallback over the same 1..999 range: pkg/kuid AllocateLeaseID (lease.go)
#   allocates by creating a coordination.k8s.io Lease named after the value,
#   labelled with the pool and the claimant's correlation id — exactly the
#   mechanism the tier's Python allocator uses for the same defect
#   (agents/provisioning/allocator/kuid.py; research.md D8: "the allocator's
#   Lease fallback for the pinned KUID server's GENID/EXTCOMM defect" is a
#   given). pkg/kuid still tries the served GENID claim first and falls back
#   when it cannot allocate (claim.go + allocate.go), so a fixed server is
#   used again without a code change.
#   The id names the VRF: `Vrf<service-id>` (§8.1: `Vrf1` measured on the
#   lab). 1..999 keeps every name short and comfortably inside CONFIG_DB
#   name limits, and stays clear of the device-allocated VRF table-id space
#   (1001+ measured in spike-kernel-seg6 — that space is read back from the
#   device, never claimed here).
#
# Pool 2 — srv6-client-v4 (ipam.be.kuid.dev/v1alpha1 IPIndex)
#   Client /24s carved from 192.168.0.0/16. Lab measured: 192.168.1.0/24 on
#   leaf01 and 192.168.2.0/24 on leaf02 (§8.1). The index holds the
#   supernet; the per-claim prefix length (24) is a property of each
#   IPClaim (spec.prefixLength), which is how the served ipam.be.kuid.dev
#   API models it — the IPIndex schema has no per-claim length field. The
#   ipam family is the `*.be.kuid.dev` family that works on the pinned
#   server (applied live 2026-10-16: server-side dry-run and real apply
#   both accept it). Field shapes verified against the live aggregated API
#   (`kubectl explain ipindices.ipam.be.kuid.dev`).
---
apiVersion: ipam.be.kuid.dev/v1alpha1
kind: IPIndex
metadata:
  name: srv6-client-v4
  namespace: kuid-system
spec:
  prefixes:
    - prefix: 192.168.0.0/16
