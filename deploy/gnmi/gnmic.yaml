# T063: Deploy gNMIc inside Kind as the sole SONiC device-metric collector
apiVersion: v1
kind: Namespace
metadata:
  name: ainetops-system
  labels:
    app.kubernetes.io/part-of: ainetops
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gnmic
  namespace: ainetops-system
  labels:
    app.kubernetes.io/name: gnmic
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gnmic-config
  namespace: ainetops-system
  labels:
    app.kubernetes.io/name: gnmic
  annotations:
    ainetops.dev/spec-version: "v1"
    ainetops.dev/export: "otlp"
    ainetops.dev/role: "device-metrics"
data:
  gnmic.yaml: |
      username: ${GNMIC_USERNAME}
      password: ${GNMIC_PASSWORD}
      skip-verify: false
      tls-ca: /etc/gnmic/tls/ca.crt
      tls-cert: /etc/gnmic/tls/tls.crt
      tls-key: /etc/gnmic/tls/tls.key
      encoding: json_ietf
      targets:
        spine01: { address: 172.31.0.11:8080 }
        spine02: { address: 172.31.0.12:8080 }
        leaf01:  { address: 172.31.0.21:8080 }
        leaf02:  { address: 172.31.0.22:8080 }
      # KNOWN GAP (2026-09-03): these OpenConfig paths do not stream on this build.
      # A Subscribe without a prefix target is rejected -- the server answers
      # "Unimplemented: Empty target data not supported", surfacing on the stream as
      # "first message must be SubscribeRequest". Setting `target:` per subscription
      # here does NOT satisfy it (tried and reverted). A manual subscribe WITH a DB
      # target (e.g. --target COUNTERS_DB) is accepted and streams, so the fix is to
      # move these to SONiC-native DB paths -- which changes the emitted metric names
      # and therefore requires the Grafana dashboards to be rewired to match.
      # SONiC's gNMI subscribe needs the DB as the prefix TARGET and the table as
      # the path. Without a target the server answers "Unimplemented: Empty target
      # data not supported", which gnmic surfaces on the stream as "first message
      # must be SubscribeRequest" -- the error this config produced on all four
      # nodes for every subscription.
      #
      # The OpenConfig paths that were here (/interfaces/interface[name=*]/state/
      # counters, /network-instances/.../bgp/neighbors/..., /sonic-srv6:...) are not
      # served by this build at all. Verified 2026-09-03 against a live node: with
      # `--path COUNTERS --target COUNTERS_DB --mode stream` the subscribe is
      # accepted and streams; the OpenConfig forms are rejected outright.
      #
      # NOTE on counters: flex counters must be enabled for COUNTERS_DB to hold
      # per-port rows at all (see lab bootstrap). On sonic-vs the SAI counters exist
      # but stay 0 -- the virtual switch forwards in the Linux kernel, not through
      # SAI -- so rate panels are flat by design here. PORT_TABLE oper state and the
      # BGP tables are the signals that carry real values on this platform.
      subscriptions:
        port-counters:
          target: COUNTERS_DB
          paths:
            - COUNTERS
          mode: stream
          stream-mode: sample
          sample-interval: 10s
        port-state:
          target: APPL_DB
          paths:
            - PORT_TABLE
          mode: stream
          stream-mode: sample
          sample-interval: 10s
        bgp-neighbors:
          target: CONFIG_DB
          paths:
            - BGP_NEIGHBOR
          mode: stream
          stream-mode: sample
          sample-interval: 30s
      outputs:
        # Native Prometheus output, scraped directly by Prometheus. The OTLP hop
        # (gnmic -> otel-collector -> prometheus) was removed: gnmic's otlp output
        # takes `endpoint` not `url`, so it never initialised and silently discarded
        # every sample, and once corrected it still rejected each batch with
        # "ResourceMetrics is empty". One hop fewer, and the collected data is
        # inspectable with a single curl against :9273/metrics.
        prom:
          type: prometheus
          listen: :9273
          path: /metrics
          expiration: 60s
          # false, deliberately: SONiC returns every DB value as a STRING ("0",
          # "up"), and with strings-as-labels the numeric ones became LABELS instead
          # of metric values -- so the SAI_PORT_STAT_* counters produced no series at
          # all and only the BGP tables (whose keys happened to survive) appeared.
          strings-as-labels: false
          # NOTE: SONiC folds the DB key into the value name, so a port yields
          # PORT_TABLE_Ethernet0_mtu -- one metric FAMILY per interface rather than a
          # single family with an `interface` label. gnmic's event-extract-tags was
          # tried here to lift the key into a label and did not match this shape;
          # it was removed rather than left in as dead config. Dashboards therefore
          # query these with __name__ regex. Fixing the shape properly is a
          # follow-up, not a blocker: the data itself is correct and complete.
      # Event processors intentionally omitted: target/device labeling is applied
      # downstream by the OTel Collector k8sattributes/attributes processors.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gnmic
  namespace: ainetops-system
  labels:
    app.kubernetes.io/name: gnmic
    ainetops.dev/component: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gnmic
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gnmic
        ainetops.dev/component: observability
    spec:
      serviceAccountName: gnmic
      containers:
        - name: gnmic
          image: ghcr.io/openconfig/gnmic@sha256:fd59f5f1c7a98e14ff5b14f85329e5e0a4d49ef1d5b0dddfd910b6caef03b9fb
          args: ["--config=/etc/gnmic/gnmic.yaml", "subscribe", "--log"]
          volumeMounts:
            - name: config
              mountPath: /etc/gnmic
            - name: tls
              mountPath: /etc/gnmic/tls
              readOnly: true
          env:
            - name: GNMIC_USERNAME
              valueFrom:
                secretKeyRef: { name: gnmi-lab-creds, key: username }
            - name: GNMIC_PASSWORD
              valueFrom:
                secretKeyRef: { name: gnmi-lab-creds, key: password }
          ports:
            - name: http
              containerPort: 9804
            - name: prom
              containerPort: 9273
      volumes:
        - name: config
          configMap:
            name: gnmic-config
        - name: tls
          secret:
            secretName: gnmi-lab-tls
            items:
              - key: ca.crt
                path: ca.crt
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
---
# Service for gnmic's native Prometheus output. Prometheus scrapes this directly;
# without it the collected telemetry has no path out of the pod. The OTLP hop that
# was the only export route silently discarded every sample (gnmic's otlp output
# takes `endpoint`, not `url`, so it never initialised), which is why Prometheus
# held nothing but scrape metadata while every component reported healthy.
apiVersion: v1
kind: Service
metadata:
  name: gnmic
  namespace: ainetops-system
  labels:
    app.kubernetes.io/name: gnmic
    app.kubernetes.io/part-of: ainetops
spec:
  selector:
    app.kubernetes.io/name: gnmic
  ports:
    - name: prom
      port: 9273
      targetPort: 9273
      protocol: TCP
