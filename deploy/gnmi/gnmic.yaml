# gNMIc inside kind as the sole SR Linux device-metric collector.
# Subscriptions and outputs follow specs/001-agentic-netops-srlinux-evpn-fabric/contracts/telemetry.md
# (research D7). SR Linux serves gNMI natively on :57400 over TLS, so the
# collector subscribes to native state paths directly -- there is no database
# target indirection and no per-key metric family fan-out.
apiVersion: v1
kind: Namespace
metadata:
  name: agentic-netops-system
  labels:
    app.kubernetes.io/part-of: agentic-netops
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gnmic
  namespace: agentic-netops-system
  labels:
    app.kubernetes.io/name: gnmic
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gnmic-config
  namespace: agentic-netops-system
  labels:
    app.kubernetes.io/name: gnmic
  annotations:
    agentic-netops.dev/spec-version: "v1"
    agentic-netops.dev/export: "prometheus"
    agentic-netops.dev/role: "device-metrics"
data:
  gnmic.yaml: |
      username: ${GNMIC_USERNAME}
      password: ${GNMIC_PASSWORD}
      # The SR Linux gNMI server presents the containerlab-generated server
      # certificate; the lab CA is published into Secret gnmi-lab-tls by the
      # bootstrap step. No client certificate is required (research D3), so
      # only the trust bundle is referenced here.
      skip-verify: false
      tls-ca: /etc/gnmic/tls/ca.crt
      encoding: json_ietf
      targets:
        spine01: { address: 172.31.0.11:57400 }
        spine02: { address: 172.31.0.12:57400 }
        leaf01:  { address: 172.31.0.21:57400 }
        leaf02:  { address: 172.31.0.22:57400 }
      subscriptions:
        interface-stats:
          paths:
            - /interface[name=ethernet-1/*]/statistics
          mode: stream
          stream-mode: sample
          sample-interval: 10s
        interface-state:
          paths:
            - /interface[name=*]/oper-state
            - /interface[name=*]/subinterface[index=*]/oper-state
          mode: stream
          stream-mode: sample
          sample-interval: 10s
        bgp-neighbors:
          paths:
            - /network-instance[name=*]/protocols/bgp/neighbor[peer-address=*]/session-state
            - /network-instance[name=*]/protocols/bgp/neighbor[peer-address=*]/afi-safi[afi-safi-name=*]/received-routes
          mode: stream
          stream-mode: sample
          sample-interval: 30s
        platform:
          paths:
            - /platform/control[slot=*]/cpu[index=all]/total/instant
            - /platform/control[slot=*]/memory
          mode: stream
          stream-mode: sample
          sample-interval: 30s
      outputs:
        # Native Prometheus output, scraped directly by Prometheus. The OTLP hop
        # (gnmic -> otel-collector -> prometheus) was removed in the previous
        # generation because gnmic's otlp output takes `endpoint` not `url` and
        # silently discarded every sample; the single hop is kept here because
        # the collected data stays inspectable with one curl against
        # :9273/metrics.
        prom:
          type: prometheus
          listen: :9273
          path: /metrics
          expiration: 60s
          # true, deliberately: SR Linux returns enumerations such as
          # oper-state ("up"/"down") and session-state ("established") as
          # strings. As labels they stay queryable next to the numeric
          # counters instead of being dropped for not parsing as a value.
          strings-as-labels: true
          event-processors:
            - add-device-label
      processors:
        # gnmic already tags every event with `source` (the target name).
        # `device` is carried as well so dashboards and the topology ConfigMap
        # can join on one label name across metric families.
        # VERIFY LIVE: confirm the emitted label set with
        #   curl -s :9273/metrics | grep interface_statistics_in_octets | head
        # before relying on `device` rather than `source` in a new panel.
        add-device-label:
          event-add-tag:
            tags:
              device: "{{ .Values.source }}"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gnmic
  namespace: agentic-netops-system
  labels:
    app.kubernetes.io/name: gnmic
    agentic-netops.dev/component: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gnmic
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gnmic
        agentic-netops.dev/component: observability
        # Scoped device-network egress for the telemetry subscriptions
        # (deploy/rbac/base.yaml allow-fabric-gnmi-egress). Without it the
        # enforced deny-all leaves every subscription dialing 172.31.0.x:57400
        # into an i/o timeout.
        agentic-netops.io/needs-fabric-gnmi: "true"
    spec:
      serviceAccountName: gnmic
      containers:
        - name: gnmic
          image: ghcr.io/openconfig/gnmic@sha256:fd59f5f1c7a98e14ff5b14f85329e5e0a4d49ef1d5b0dddfd910b6caef03b9fb
          args: ["--config=/etc/gnmic/gnmic.yaml", "subscribe", "--log"]
          volumeMounts:
            - name: config
              mountPath: /etc/gnmic
            - name: tls
              mountPath: /etc/gnmic/tls
              readOnly: true
          env:
            - name: GNMIC_USERNAME
              valueFrom:
                secretKeyRef: { name: gnmi-lab-creds, key: username }
            - name: GNMIC_PASSWORD
              valueFrom:
                secretKeyRef: { name: gnmi-lab-creds, key: password }
          ports:
            - name: http
              containerPort: 9804
            - name: prom
              containerPort: 9273
      volumes:
        - name: config
          configMap:
            name: gnmic-config
        - name: tls
          secret:
            secretName: gnmi-lab-tls
            items:
              - key: ca.crt
                path: ca.crt
---
# Service for gnmic's native Prometheus output. Prometheus scrapes this
# directly; without it the collected telemetry has no path out of the pod.
apiVersion: v1
kind: Service
metadata:
  name: gnmic
  namespace: agentic-netops-system
  labels:
    app.kubernetes.io/name: gnmic
    app.kubernetes.io/part-of: agentic-netops
spec:
  selector:
    app.kubernetes.io/name: gnmic
  ports:
    - name: prom
      port: 9273
      targetPort: 9273
      protocol: TCP
