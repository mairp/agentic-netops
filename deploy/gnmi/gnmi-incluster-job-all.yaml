# Proof utility: in-cluster gNMI reachability check against all four SR Linux
# nodes. Capabilities is the honest reachability signal: it exercises TLS with
# the lab CA, the generated credentials and the gNMI server itself, and its
# body names the srl_nokia-* models the renderer writes against.
apiVersion: batch/v1
kind: Job
metadata:
  name: gnmi-incluster-check-all
  namespace: agentic-netops-system
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gnmi-incluster-check-all
        # Scoped device-network egress (deploy/rbac/base.yaml
        # allow-fabric-gnmi-egress).
        agentic-netops.io/needs-fabric-gnmi: "true"
    spec:
      restartPolicy: Never
      containers:
      - name: gnmic
        image: ghcr.io/openconfig/gnmic@sha256:fd59f5f1c7a98e14ff5b14f85329e5e0a4d49ef1d5b0dddfd910b6caef03b9fb
        command: ["/bin/sh","-c"]
        args:
          - |
            set -e
            for a in 172.31.0.11 172.31.0.12 172.31.0.21 172.31.0.22; do
              echo "=== gNMI Capabilities ${a}:57400 ===";
              gnmic --timeout=5s --address=${a}:57400 \
                    --tls-ca=/etc/gnmic/tls/ca.crt --encoding=json_ietf \
                    capabilities || exit 1;
              echo;
            done
        env:
          - name: GNMIC_USERNAME
            valueFrom:
              secretKeyRef:
                name: gnmi-lab-creds
                key: username
          - name: GNMIC_PASSWORD
            valueFrom:
              secretKeyRef:
                name: gnmi-lab-creds
                key: password
        volumeMounts:
          - name: tls
            mountPath: /etc/gnmic/tls
            readOnly: true
      volumes:
        - name: tls
          secret:
            secretName: gnmi-lab-tls
            items:
              - key: ca.crt
                path: ca.crt
