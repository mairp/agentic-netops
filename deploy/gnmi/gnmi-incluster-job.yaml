# T019 proof utility: in-cluster gNMI reachability check Job
apiVersion: batch/v1
kind: Job
metadata:
  name: gnmi-incluster-check
  namespace: agentic-netops-system
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: gnmic
        image: ghcr.io/karimra/gnmic@sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
        args:
          - "--timeout=5s"
          - "--address=172.31.0.11:9339"
          - "--skip-verify"
          - "capabilities"
        env:
          - name: GNMIC_USERNAME
            valueFrom:
              secretKeyRef:
                name: gnmi-lab-creds
                key: username
          - name: GNMIC_PASSWORD
            valueFrom:
              secretKeyRef:
                name: gnmi-lab-creds
                key: password
        envFrom:
          - secretRef:
              name: gnmi-lab-tls
