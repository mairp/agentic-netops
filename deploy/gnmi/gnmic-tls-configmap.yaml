# gNMIc TLS trust bundle reference paths. The material itself lives in Secret
# gnmi-lab-tls, created by lab bootstrap from the containerlab-generated CA.
# The SR Linux gNMI server does not require a client certificate (research
# D3), so `ca_path` is the only path the collector consumes; cert/key are kept
# for API compatibility with consumers that still mount them.
apiVersion: v1
kind: ConfigMap
metadata:
  name: gnmic-tls-config
  namespace: agentic-netops-system
  labels:
    app.kubernetes.io/name: gnmic
  annotations:
    agentic-netops.dev/spec-version: "v1"
data:
  ca_path: "/etc/gnmic/tls/ca.crt"
  cert_path: "/etc/gnmic/tls/tls.crt"
  key_path: "/etc/gnmic/tls/tls.key"
