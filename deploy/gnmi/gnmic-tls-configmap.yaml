# T073: Provide gNMIc TLS trust bundle and cert/key via SecretRef; configMap holds reference paths
apiVersion: v1
kind: ConfigMap
metadata:
  name: gnmic-tls-config
  namespace: agentic-netops-system
  labels:
    app.kubernetes.io/name: gnmic
  annotations:
    agentic-netops.dev/spec-version: "v1"
data:
  ca_path: "/etc/gnmic/tls/ca.crt"
  cert_path: "/etc/gnmic/tls/tls.crt"
  key_path: "/etc/gnmic/tls/tls.key"
