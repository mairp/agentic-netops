# Agentic NetOps SRv6 controller placeholder Deployment and Service (T023)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentic-netops-srv6-controller
  namespace: agentic-netops-system
  labels:
    app.kubernetes.io/name: agentic-netops-srv6-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agentic-netops-srv6-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentic-netops-srv6-controller
        # Selected by allow-apiserver-egress (deploy/rbac/base.yaml). This is a
        # Kubernetes controller: it watches CRDs through the API server, so
        # deny-all-by-default's blanket egress denial stops it before it can build
        # its informers ("unable to set up indexes ... dial tcp 10.96.0.1:443:
        # i/o timeout") and it never reaches Ready.
        agentic-netops.io/needs-apiserver: "true"
        # Scoped device-network egress for gNMI read-back against the fabric
        # (deploy/rbac/base.yaml allow-fabric-gnmi-egress).
        agentic-netops.io/needs-fabric-gnmi: "true"
        # Selected by allow-fabric-executor-egress (deploy/rbac/base.yaml): the
        # only egress to the host fabric-executor write path this reconciler
        # drives (T399 — "Done when the pod reaches the executor").
        agentic-netops.io/needs-fabric-executor: "true"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: agentic-netops-srv6-controller
      containers:
      - name: srv6-controller
        image: ghcr.io/agentic-netops/agentic-netops-srv6-controller@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        args: ["--metrics-bind=:8081", "--health-probe-bind=:8082"]
        ports:
        - name: http
          containerPort: 8081
        env:
        - name: OTEL_SERVICE_NAME
          value: agentic-netops-srv6-controller
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otel-collector.agentic-netops-system:4318
        # Fabric write path (T399): the host fabric-executor service on the
        # kind bridge gateway, reached through allow-fabric-executor-egress.
        - name: FABRIC_EXECUTOR_URL
          value: http://172.30.0.1:8084
        # Port map contract (same as the provider, T187/T602): the spec's
        # logical attachment names resolved to the lab's kernel ports. The map
        # is profile data — provision.sh replaces this value from
        # lab/profiles/<profile>/port-map.json; unknown names are rejected by
        # the renderer, never guessed.
        - name: FABRIC_PORT_MAP
          value: '{"wan1":"Ethernet12"}'
        # Node kind is profile data too (T192): plans render for the guests
        # the profile actually runs; provision.sh replaces this value.
        - name: FABRIC_NODE_KIND
          value: sonic-vm
        readinessProbe:
          httpGet: { path: /readyz, port: 8082 }
          initialDelaySeconds: 5
        livenessProbe:
          httpGet: { path: /healthz, port: 8082 }
          initialDelaySeconds: 10
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: agentic-netops-srv6-controller
  namespace: agentic-netops-system
spec:
  selector:
    app.kubernetes.io/name: agentic-netops-srv6-controller
  ports:
  - name: http
    port: 8081
    targetPort: 8081
