# Address-based DiscoveryRule creating four Targets, one per SR Linux node.
apiVersion: sdc.sdcio.dev/v1alpha1
kind: DiscoveryRule
metadata:
  name: srlinux-management
  namespace: sdc-system
spec:
  addresses:
  - 172.31.0.11
  - 172.31.0.12
  - 172.31.0.21
  - 172.31.0.22
  connectionProfileRef:
    name: srlinux-conn-profile
  schemaRef:
    name: srlinux
