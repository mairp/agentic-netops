# Namespaces, service accounts, RBAC, and NetworkPolicies (Phase 3 T022)
apiVersion: v1
kind: Namespace
metadata:
  name: agentic-netops-system
  labels:
    agentic-netops.owner: agentic-netops
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentic-netops-controller
  namespace: agentic-netops-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agentic-netops-controller
  namespace: agentic-netops-system
rules:
- apiGroups: [""]
  # The secret-generator Job (serviceAccountName agentic-netops-controller) must read and
  # (re)create the runtime gnmi-lab-creds / gnmi-lab-tls Secrets in this namespace.
  resources: ["configmaps", "events", "secrets"]
  verbs: ["get", "list", "watch", "create", "update", "patch"]
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agentic-netops-controller
  namespace: agentic-netops-system
subjects:
- kind: ServiceAccount
  name: agentic-netops-controller
  namespace: agentic-netops-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agentic-netops-controller
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all-by-default
  namespace: agentic-netops-system
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
apiVersion: v1
kind: Secret
metadata:
  name: gnmi-lab-ca
  namespace: agentic-netops-system
  annotations:
    agentic-netops.generated: "true"
  labels:
    agentic-netops.owner: agentic-netops
type: Opaque
stringData:
  note: "Generated at runtime; placeholder manifest proves API surface. No real credential committed."
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentic-netops-srv6-controller
  namespace: agentic-netops-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentic-netops-sonic-provider
  namespace: agentic-netops-system

