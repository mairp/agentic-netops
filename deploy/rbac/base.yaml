# Namespaces, service accounts, RBAC, and NetworkPolicies (Phase 3 T022)
apiVersion: v1
kind: Namespace
metadata:
  name: agentic-netops-system
  labels:
    agentic-netops.owner: agentic-netops
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentic-netops-controller
  namespace: agentic-netops-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agentic-netops-controller
  namespace: agentic-netops-system
rules:
- apiGroups: [""]
  # The secret-generator Job (serviceAccountName agentic-netops-controller) must read and
  # (re)create the runtime gnmi-lab-creds / gnmi-lab-tls Secrets in this namespace.
  resources: ["configmaps", "events", "secrets"]
  verbs: ["get", "list", "watch", "create", "update", "patch"]
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agentic-netops-controller
  namespace: agentic-netops-system
subjects:
- kind: ServiceAccount
  name: agentic-netops-controller
  namespace: agentic-netops-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agentic-netops-controller
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all-by-default
  namespace: agentic-netops-system
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
# Egress to the Kubernetes API server, for the pods in this namespace that must
# reach it. deny-all-by-default above denies ALL egress, API server included --
# which was inert until the CNI started enforcing NetworkPolicy (kind v0.22's
# kindnetd ignored policies; the pinned kindnetd v20250214 enforces them). On the
# rebuilt cluster it blocked the secret-generator Job outright: every kubectl call
# died with "dial tcp 10.96.0.1:443: i/o timeout" and provision.sh aborted at the
# RBAC phase (2026-09-03).
#
# The destination is expressed as an ipBlock, not a namespace/pod selector: the
# API server is a hostNetwork static pod reached through a Service ClusterIP that
# DNATs to the node address, and selectors match neither. Scoped to the API
# endpoints only -- the service ClusterIP and the control-plane node on 6443.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-apiserver-egress
  namespace: agentic-netops-system
spec:
  podSelector:
    matchLabels:
      agentic-netops.io/needs-apiserver: "true"
  policyTypes: ["Egress"]
  egress:
  # The destination must be written host-independently. kindnetd evaluates egress
  # against the POST-DNAT address, so allowing only the Service ClusterIP
  # (10.96.0.1/32:443) does NOT work -- verified: the packet is matched as
  # <control-plane-node-IP>:6443. And the node address cannot be hardcoded: kind's
  # docker network takes a Docker-assigned IPv4 subnet (172.30.0.0/16 on one host,
  # something else on the next), so a literal node CIDR silently stops matching on
  # a rebuild elsewhere and this whole failure returns.
  #
  # So: any address, but only on the two API-server ports, minus the containerlab
  # management subnet. That subnet IS pinned (kind.sh AGENTIC_NETOPS_MGMT_SUBNET,
  # lab/topology.clab.yml mgmt.ipv4-subnet), and excepting it keeps SC-005's
  # device-network denial intact -- verified: the API server answers 200 while
  # 172.31.0.21 still times out.
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
        except:
        - 172.31.0.0/16
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 6443
---
# Scoped device-network egress for the SANCTIONED southbound only (2026-09-04).
#
# deny-all-by-default above denies every pod's egress, and since kindnetd began
# enforcing NetworkPolicy that silently severed the lab's own fabric plumbing:
# gnmic's telemetry subscriptions died with "dial tcp 172.31.0.x:8080: i/o
# timeout" on all four nodes, and any in-cluster read-back against the devices
# became impossible. The intent tier (agentic-netops-agents) must keep its
# device-network denial intact (SC-005), but the southbound controllers and the
# telemetry subscriber are the components whose entire job is to talk to the
# fabric, so they get the one narrow hole this policy carves: TCP 8080
# (gNMI/TLS telemetry) into the pinned containerlab management subnet
# (AGENTIC_NETOPS_MGMT_SUBNET, scripts/lib/kind.sh) and nothing else.
#
# Opt in per workload with the label below; nothing else in the namespace
# matches it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-fabric-gnmi-egress
  namespace: agentic-netops-system
spec:
  podSelector:
    matchLabels:
      agentic-netops.io/needs-fabric-gnmi: "true"
  policyTypes: ["Egress"]
  egress:
  - to:
    - ipBlock:
        cidr: 172.31.0.0/16
    ports:
    - protocol: TCP
      port: 8080
---
# The SONiC provider's write path runs through the fabric-executor, a host
# service on the kind bridge gateway (172.30.0.1:8084 — scripts/provision.sh
# starts it next to the docker daemon it execs through). This carves exactly
# that one destination for the pods labeled needs-fabric-executor; the intent
# tier keeps no route here (SC-005: only the system tier reaches fabric
# control surfaces).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-fabric-executor-egress
  namespace: agentic-netops-system
spec:
  podSelector:
    matchLabels:
      agentic-netops.io/needs-fabric-executor: "true"
  policyTypes: ["Egress"]
  egress:
  - to:
    - ipBlock:
        cidr: 172.30.0.1/32
    ports:
    - protocol: TCP
      port: 8084
---
apiVersion: v1
kind: Secret
metadata:
  name: gnmi-lab-ca
  namespace: agentic-netops-system
  annotations:
    agentic-netops.generated: "true"
  labels:
    agentic-netops.owner: agentic-netops
type: Opaque
stringData:
  note: "Generated at runtime; placeholder manifest proves API surface. No real credential committed."
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentic-netops-srv6-controller
  namespace: agentic-netops-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentic-netops-sonic-provider
  namespace: agentic-netops-system

