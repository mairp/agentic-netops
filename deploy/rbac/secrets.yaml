# T022: Kubernetes-native generation of lab credential/TLS Secrets
# No credentials are stored in repository manifests. Secrets are created at runtime via a generator Job.
---
apiVersion: v1
kind: Secret
metadata:
  name: gnmi-lab-creds
  namespace: ainetops-system
  annotations:
    ainetops.generated: "true"
  labels:
    ainetops.owner: ainetops
  # Empty placeholder. Generator Job will populate data keys (username,password).
  # type and data intentionally omitted to avoid embedding credentials.
---
apiVersion: v1
kind: Secret
metadata:
  name: gnmi-lab-tls
  namespace: ainetops-system
  annotations:
    ainetops.generated: "true"
  labels:
    ainetops.owner: ainetops
  # Empty placeholder. Generator Job will populate data keys (ca.crt,tls.crt,tls.key).
  # type and data intentionally omitted to avoid embedding credentials.
