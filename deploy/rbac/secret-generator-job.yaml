# T022: In-cluster generator Job to populate lab Secrets without storing credentials in Git
apiVersion: batch/v1
kind: Job
metadata:
  name: ainetops-secret-generator
  namespace: ainetops-system
spec:
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: ainetops-controller
      containers:
      - name: generator
        # Pinned Kind node image (kind.node_image in versions.lock.yaml). It carries
        # kubectl + openssl + curl, so the generator needs no separate image and no
        # external registry pull (reproducible on an air-gapped qualified host).
        image: kindest/node@sha256:3abb816a5b1061fb15c6e9e60856ec40d56b7b52bcea5f5f1350bc6e2320b6f8
        command: ["/bin/bash","-c"]
        args:
        - |
          set -euo pipefail
          # IDEMPOTENT (fix 2026-09-01): generate ONLY when missing. The job re-runs
          # on every provision; rotating the creds each time desynchronizes them
          # from the SONiC nodes (their gNMI linux user was created from the secret
          # at bootstrap time), which surfaced as Unauthenticated on sonic-db
          # queries whenever a test ran against a lab from a previous generation
          # (observed in cycles cycles 1-3, 2026-09-01). A kind teardown removes
          # the secret together with the cluster, and the lab is re-bootstrapped
          # from the fresh secret — so create-on-missing keeps every path consistent.
          if kubectl -n ainetops-system get secret gnmi-lab-creds >/dev/null 2>&1; then
            echo "gnmi-lab-creds exists; not rotating"
          else
            # Create random admin/admin pair for lab use only; replace with stronger in real lab
            USER=$(cat /proc/sys/kernel/random/uuid | cut -c1-8)
            PASS=$(cat /proc/sys/kernel/random/uuid | cut -c1-12)
            kubectl -n ainetops-system create secret generic gnmi-lab-creds --dry-run=client \
              --from-literal=username=$USER --from-literal=password=$PASS -o yaml | kubectl apply -f -
          fi
          # Generate ephemeral self-signed TLS via openssl.
          # SANs MUST cover the deterministic lab mgmt IPs (lab/topology.clab.yml:
          # spine01 .11, spine02 .12, leaf01 .21, leaf02 .22) plus localhost so
          # gnmic clients can verify the server certificate by the IP they dial.
          # Same idempotence rule: the nodes present the server cert they were
          # bootstrapped with; rotating the CA would break TLS trust for them.
          if kubectl -n ainetops-system get secret gnmi-lab-tls >/dev/null 2>&1; then
            echo "gnmi-lab-tls exists; not rotating"
          else
            openssl req -x509 -nodes -newkey rsa:2048 -keyout /tmp/tls.key -out /tmp/tls.crt \
              -subj "/CN=ainetops" -days 30 \
              -addext "subjectAltName=DNS:localhost,DNS:ainetops,IP:127.0.0.1,IP:172.31.0.11,IP:172.31.0.12,IP:172.31.0.21,IP:172.31.0.22"
            cp /tmp/tls.crt /tmp/ca.crt
            kubectl -n ainetops-system create secret generic gnmi-lab-tls --dry-run=client \
              --from-file=ca.crt=/tmp/ca.crt --from-file=tls.crt=/tmp/tls.crt --from-file=tls.key=/tmp/tls.key -o yaml | kubectl apply -f -
          fi
          echo "generated"
