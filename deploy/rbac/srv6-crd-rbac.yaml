apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ainetops-srv6-controller-crd
rules:
- apiGroups: ["apiextensions.k8s.io"]
  resources: ["customresourcedefinitions"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["ainetops.io"]
  resources: ["srv6services", "srv6services/status"]
  verbs: ["get", "list", "watch", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ainetops-srv6-controller-crd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ainetops-srv6-controller-crd
subjects:
- kind: ServiceAccount
  name: ainetops-srv6-controller
  namespace: ainetops-system
