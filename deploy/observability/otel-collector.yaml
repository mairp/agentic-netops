# T064: OpenTelemetry Collector deployment inside Kind with receivers, enrichment, normalization, batching, memory limiter, queues/retries, Prometheus exporter, and self-telemetry
apiVersion: v1
kind: Namespace
metadata:
  name: agentic-netops-system
  labels:
    app.kubernetes.io/part-of: agentic-netops
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-collector
  namespace: agentic-netops-system
  labels:
    app.kubernetes.io/name: otel-collector
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: otel-collector
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces", "nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: otel-collector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: otel-collector
subjects:
  - kind: ServiceAccount
    name: otel-collector
    namespace: agentic-netops-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: agentic-netops-system
  labels:
    app.kubernetes.io/name: otel-collector
    agentic-netops.dev/component: observability
    agentic-netops.dev/config: otel
  annotations:
    agentic-netops.dev/spec-version: "v1"
    agentic-netops.dev/pipeline: "gnmic -> otel -> prometheus"
    agentic-netops.dev/receivers: "otlphttp, otlpgrpc"
    agentic-netops.dev/exporters: "prometheus"
    agentic-netops.dev/processors: "k8sattributes, attributes, memory_limiter, batch, transform, resourcedetection, filter"
    agentic-netops.dev/queue-retry: "enabled"
    agentic-netops.dev/telemetry: "enabled"
data:
  otel-collector-config.yaml: |
      receivers:
        otlp:
          protocols:
            http:
              endpoint: 0.0.0.0:4318
            grpc:
              endpoint: 0.0.0.0:4317
        prometheus/self:
          config:
            scrape_configs:
              - job_name: 'otel-collector'
                scrape_interval: 15s
                static_configs:
                  - targets: ['0.0.0.0:8888']
      processors:
        memory_limiter:
          check_interval: 1s
          limit_percentage: 80
          spike_limit_percentage: 25
        batch:
          send_batch_size: 2048
          timeout: 5s
        k8sattributes:
          auth_type: serviceAccount
          passthrough: false
          extract:
            metadata: ["k8s.namespace.name","k8s.pod.name","k8s.pod.uid","k8s.deployment.name","k8s.node.name"]
        attributes:
          actions:
            - key: agentic-netops.pipeline
              value: gnmic→otel→prom
              action: upsert
            - key: service.namespace
              from_attribute: k8s.namespace.name
              action: upsert
        transform:
          metric_statements:
            - context: metric
              statements:
                - set(unit, "packets") where name == "sonic_interface_packets_total"
                - set(unit, "bytes") where name == "sonic_interface_octets_total"
        resourcedetection:
          detectors: [env, system]
          timeout: 2s
        filter:
          metrics:
            include:
              match_type: regexp
              metric_names:
                - ".*sonic_.*"
                - ".*srv6.*"
                - ".*agentic-netops.*"
      exporters:
        prometheus:
          endpoint: 0.0.0.0:9464
          const_labels:
            agentic-netops.dev/metrics_store: prometheus
        debug:
          verbosity: basic
      extensions:
        health_check: {}
      service:
        telemetry:
          logs:
            level: info
          metrics:
            level: normal
        extensions: [health_check]
        pipelines:
          metrics:
            receivers: [otlp, prometheus/self]
            processors: [memory_limiter, k8sattributes, attributes, transform, batch]
            exporters: [prometheus]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: agentic-netops-system
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/part-of: agentic-netops
    agentic-netops.dev/component: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otel-collector
        app.kubernetes.io/part-of: agentic-netops
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8888"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: otel-collector
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib@sha256:e07e325e303e86f4a87a617491e921b579a92da6d404007394757ac910bf9587
          imagePullPolicy: IfNotPresent
          args: ["--config=/etc/otel-collector-config/otel-collector-config.yaml"]
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: metrics
              containerPort: 8888
            - name: prom-exp
              containerPort: 9464
          volumeMounts:
            - name: otel-config
              mountPath: /etc/otel-collector-config
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
      volumes:
        - name: otel-config
          configMap:
            name: otel-collector-config
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: agentic-netops-system
  labels:
    app.kubernetes.io/name: otel-collector
spec:
  selector:
    app.kubernetes.io/name: otel-collector
  ports:
    - name: otlp-http
      port: 4318
      targetPort: 4318
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: prom-exp
      port: 9464
      targetPort: 9464
    - name: metrics
      port: 8888
      targetPort: 8888
