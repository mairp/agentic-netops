# Alerts for link/BGP loss, failed/degraded reconciliation, persistent
# deviation, unreachable target, topology mismatch and gNMIc/OTel export
# failure on the Nokia SR Linux fabric.
#
# Series names follow gnmic's default underscore-joined path naming for the
# SR Linux subscriptions in deploy/gnmi/gnmic.yaml; the label set is documented
# in deploy/observability/metrics-inventory.md. String-valued state leaves
# (oper-state, session-state) arrive as labels because the collector runs with
# `strings-as-labels: true`.
# VERIFY LIVE: the exact emitted series and label names have not been observed
# on the running image yet (the SR Linux take has not been recorded); confirm
# them with `curl :9273/metrics` before trusting an alert's silence.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: agentic-netops-alerts
  namespace: monitoring
  labels:
    app.kubernetes.io/name: prometheus
spec:
  groups:
    - name: agentic-netops.fabric
      rules:
        - alert: FabricInterfaceDown
          expr: max_over_time(interface_oper_state{oper_state="down",interface_name=~"ethernet-1/.*"}[5m]) == 1
          for: 5m
          labels: { severity: warning }
          annotations:
            description: "An SR Linux fabric interface reports oper-state down"
            summary: "Fabric link down"
        - alert: BGPPeerDown
          expr: max_over_time(network_instance_protocols_bgp_neighbor_session_state{session_state!="established"}[2m]) == 1
          for: 2m
          labels: { severity: critical }
          annotations:
            description: "A BGP session (underlay eBGP or EVPN overlay iBGP) is not established"
            summary: "BGP peer down"
        - alert: TelemetryTargetSilent
          expr: count by(source) (interface_statistics_in_octets) < 1
          for: 5m
          labels: { severity: warning }
          annotations:
            description: "No interface statistics received from this SR Linux target"
            summary: "gNMI target silent"
        - alert: ProviderFailedReconcile
          expr: increase(controller_runtime_reconcile_errors_total{controller="agentic-netops-srlinux-provider"}[5m]) > 0
          for: 5m
          labels: { severity: warning }
          annotations:
            description: "srlinux-provider reconcile errors observed (gNMI Set or verify failing)"
            summary: "Reconciliation failed"
        - alert: ProviderDegradedDeviation
          expr: increase(agentic_netops_srlprovider_applies_total[15m]) > 0 and on() absent_over_time(agentic_netops_srlprovider_applies_total[15m]) == 0
          for: 15m
          labels: { severity: warning }
          annotations:
            description: "Deviation persists without a successful apply"
            summary: "Persistent deviation"
        - alert: SDCTargetUnreachable
          expr: sdc_target_reachable == 0
          for: 2m
          labels: { severity: warning }
          annotations:
            description: "SDC cannot reach an SR Linux gNMI target on :57400"
            summary: "Target unreachable"
        # SRv6 alerting is intentionally absent: the SR Linux container has no
        # SRv6 data plane, so there is no MySID counter to alert on. An alert
        # that can never fire would read as coverage the site does not have.
        - alert: TopologyInventoryMismatch
          expr: count(count by(source) (interface_statistics_in_octets)) != 4
          for: 10m
          labels: { severity: warning }
          annotations:
            description: "Telemetry sources do not match the four-node containerlab inventory"
            summary: "Topology inventory mismatch"
        - alert: GNMIcExportFailures
          expr: rate(gnmic_output_errors_total[5m]) > 0
          for: 5m
          labels: { severity: warning }
          annotations:
            description: "gNMIc output errors detected"
            summary: "gNMIc export failure"
        - alert: OTelExportFailures
          expr: rate(otelcol_exporter_enqueue_failed[5m]) > 0
          for: 5m
          labels: { severity: warning }
          annotations:
            description: "OTel Collector exporter failures"
            summary: "OTel export failure"
