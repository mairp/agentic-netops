---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
    agentic-netops.dev/component: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana@sha256:408afb9726de5122b00a2576763a8a57a3c86d5b0eff5305bc994ceb3eb96c3f
          # No third-party plugin install: GF_INSTALL_PLUGINS was removed because
          # the previously pinned "grafana-flow-panel" reference was not a real
          # installable plugin (the reference made Grafana crash-loop at startup).
          # Topology/service-path views use Grafana built-in panels only; the
          # upstream flow visualization remains recorded in versions.lock.yaml as
          # a presentation reference (FR-032).
          env:
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "false"
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef: { name: grafana-admin, key: admin-user }
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: { name: grafana-admin, key: admin-password }
          ports:
            - name: http
              containerPort: 3000
          volumeMounts:
            - name: storage
              mountPath: /var/lib/grafana
            # Grafana scans provisioning/datasources/ and provisioning/dashboards/
            # -- SUBDIRECTORIES. Mounting the ConfigMap flat at
            # /etc/grafana/provisioning put datasources.yaml and dashboards.yaml
            # one level too high, so Grafana found neither: the API reported 0
            # datasources and 0 dashboards while both files sat correctly mounted
            # in the pod and all 5 dashboard JSONs were present on disk. The whole
            # observability stack deployed and displayed nothing (2026-09-03).
            - name: provisioning
              mountPath: /etc/grafana/provisioning/datasources/datasources.yaml
              subPath: datasources.yaml
            - name: provisioning
              mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml
              subPath: dashboards.yaml
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
      volumes:
        - name: storage
          persistentVolumeClaim: { claimName: grafana }
        - name: provisioning
          configMap: { name: grafana-provisioning }
        - name: dashboards
          configMap: { name: grafana-dashboards }
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
spec:
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - name: http
      port: 3000
      targetPort: 3000
