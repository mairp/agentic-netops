# T066: Grafana deployment with PVC, Secret-based credentials, Service, provisioned Prometheus datasource, pinned Flow plugin, folders, and dashboards as code
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    app.kubernetes.io/part-of: agentic-netops
---
# Secret grafana-admin is generated at runtime by deploy/observability/grafana-secret-generator-job.yaml
# No static credentials are stored in Git.

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana
  namespace: monitoring
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
  annotations:
    agentic-netops.dev/spec-version: "v1"
    agentic-netops.dev/plugin.flow: "pinned"
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.monitoring.svc.cluster.local:9090
        isDefault: true
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'agentic-netops-dashboards'
        orgId: 1
        folder: 'Agentic NetOps'
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
data:
  fabric-overview.json: |
    { "annotations": {"list": []}, "editable": true, "fiscalYearStartMonth": 0, "graphTooltip": 0, "panels": [], "schemaVersion": 39, "title": "Agentic NetOps Fabric Overview", "version": 1 }
  fabric-telemetry.json: |
    {
      "title": "Agentic NetOps Fabric Telemetry",
      "uid": "agentic-netops-fabric-telemetry",
      "tags": [
        "agentic-netops",
        "fabric",
        "gnmi",
        "srlinux"
      ],
      "description": "Live gNMI telemetry from the four Nokia SR Linux nodes. The in-cluster gNMIc collector subscribes to SR Linux native state paths (deploy/gnmi/gnmic.yaml) and exposes them on its own Prometheus endpoint; series names follow gnmic's default underscore-joined path naming and are listed in deploy/observability/metrics-inventory.md.",
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "10s",
      "time": {
        "from": "now-30m",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Fabric nodes reporting telemetry",
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 0,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  },
                  {
                    "color": "green",
                    "value": 4
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value"
          },
          "targets": [
            {
              "expr": "count(count by (source) (interface_oper_state))",
              "legendFormat": "nodes",
              "refId": "A"
            }
          ]
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Interfaces discovered",
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 6,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "fixed",
                "fixedColor": "blue"
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value"
          },
          "targets": [
            {
              "expr": "count(interface_oper_state)",
              "legendFormat": "ifaces",
              "refId": "A"
            }
          ]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "BGP neighbors reporting",
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 12,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "fixed",
                "fixedColor": "purple"
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value"
          },
          "targets": [
            {
              "expr": "count(network_instance_protocols_bgp_neighbor_session_state)",
              "legendFormat": "neighbors",
              "refId": "A"
            }
          ]
        },
        {
          "id": 4,
          "type": "stat",
          "title": "gNMI collector",
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 18,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "1": {
                      "text": "UP",
                      "color": "green"
                    },
                    "0": {
                      "text": "DOWN",
                      "color": "red"
                    }
                  }
                }
              ],
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value"
          },
          "targets": [
            {
              "expr": "up{job=\"gnmic\"}",
              "legendFormat": "gnmic",
              "refId": "A"
