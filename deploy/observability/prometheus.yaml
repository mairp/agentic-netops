# T065: Prometheus deployment with PVC, retention, resource limits, scrape, rules, and healthy-target assertions
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    app.kubernetes.io/part-of: agentic-netops
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus
  namespace: monitoring
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
  labels:
    app.kubernetes.io/name: prometheus
data:
    prometheus.yml: |
      global:
        scrape_interval: 15s
        evaluation_interval: 15s
      scrape_configs:
        # Scrape gnmic directly. The OTLP hop (gnmic -> otel-collector -> prometheus)
        # silently dropped everything: gnmic's otlp output takes `endpoint`, not
        # `url`, so it failed to initialise and discarded every sample while the
        # collector reported itself healthy. gnmic's native Prometheus output is the
        # reference shape and is one hop shorter, so it is the primary path now.
        - job_name: 'gnmic'
          scrape_interval: 15s
          static_configs:
            - targets: ['gnmic.agentic-netops-system.svc.cluster.local:9273']
        - job_name: 'otel-collector'
          static_configs:
            - targets: ['otel-collector.agentic-netops-system.svc.cluster.local:9464']
        # The fabric-executor is a HOST service, not a pod: it holds the lab's
        # SSH keys for its node transports, so it runs on the container host
        # and there is no pod annotation to discover. Scrape it through the
        # `kind` docker-network gateway address — the one host vantage pods
        # can reach (the executor binds :8084 on every interface; the gateway
        # of the kind bridge is the host itself). T560: this job is the only
        # source of the kernel per-SID counters (T560,
        # fabric_executor_srv6_sid_packets_total) the SRv6 Service Path
        # dashboard plots — without it the panel has no series.
        - job_name: 'fabric-executor'
          scrape_interval: 15s
          static_configs:
            - targets: ['172.30.0.1:8084']
        - job_name: 'controllers'
          kubernetes_sd_configs:
            - role: pod
          relabel_configs:
            - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
              action: keep
              regex: true
            - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
              action: replace
              target_label: __metrics_path__
              regex: (.+)
            # Address = <pod IP>:<annotation port>. An earlier shape replaced
            # __address__ with the port alone (target "http://8081:80/metrics"
            # — DNS lookup of "8081"), which took the whole controllers job
            # down; the pod IP is the address, the annotated port is the port.
            - source_labels: [__meta_kubernetes_pod_ip, __meta_kubernetes_pod_annotation_prometheus_io_port]
              action: replace
              target_label: __address__
              regex: (.+);(\d+)
              replacement: $1:$2
            - action: labelmap
              regex: __meta_kubernetes_pod_label_(.+)
      rule_files:
        - /etc/prometheus/rules/*.rules.yml
---
# Prometheus runs as the namespace-default ServiceAccount and discovers scrape
# targets through the Kubernetes API (role: pod). Without this grant the API
# answers Forbidden, the `controllers` job discovers nothing and every
# controller gauge the SRv6 dashboard plots goes stale. Bridged live-only
# during phase 10 attempt 2; in the repo since the same phase's attempt 3
# (the per-SID panel made "every dashboard expression returns series" a live
# gate this phase owns end to end — see the suite's 5d check).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: monitoring-prometheus-pod-reader
rules:
  - apiGroups: [""]
    resources: [pods, services, endpoints]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: monitoring-prometheus-pod-reader
subjects:
  - kind: ServiceAccount
    name: default
    namespace: monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: monitoring-prometheus-pod-reader
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: monitoring
  labels:
    app.kubernetes.io/name: prometheus
data:
    targets.rules.yml: |
      groups:
        - name: targets.health
          rules:
            - alert: OTelCollectorDown
              expr: up{job="otel-collector"} == 0
              for: 2m
              labels: { severity: critical }
              annotations:
                summary: OTel Collector target down
                description: Prometheus cannot scrape the OTel Collector exporter.
            - alert: Agentic NetOpsControllersDown
              expr: sum by(pod) (up{job="controllers"}) == 0
              for: 2m
              labels: { severity: warning }
              annotations:
                summary: Agentic NetOps controller target missing
                description: Prometheus scrape discovered no controller metrics endpoints.
            - alert: FabricExecutorDown
              expr: up{job="fabric-executor"} == 0
              for: 2m
              labels: { severity: warning }
              annotations:
                summary: fabric-executor target down
                description: Prometheus cannot scrape the host-side fabric-executor /metrics — the kernel per-SID and VRF forwarding counters (T560) go stale while it is down.
    agentic-netops.rules.yml: |
      groups:
        - name: agentic-netops.alerts.include
          rules:
            - record: agentic_netops_constant_one
              expr: 1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app.kubernetes.io/name: prometheus
    agentic-netops.dev/component: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus@sha256:f20d3127bf2876f4a1df76246fca576b41ddf1125ed1c546fbd8b16ea55117e6
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=24h
            - --storage.tsdb.retention.size=4GB
            - --web.enable-lifecycle
            # Remote write receiver left at its disabled default: Prometheus
            # boolean flags reject an explicit "=false" value (T073).
          ports:
            - name: http
              containerPort: 9090
          volumeMounts:
            - name: storage
              mountPath: /prometheus
            - name: config
              mountPath: /etc/prometheus
            - name: rules
              mountPath: /etc/prometheus/rules
          resources:
            requests: { cpu: "200m", memory: "512Mi" }
            limits:   { cpu: "1", memory: "1Gi" }
      volumes:
        - name: storage
          persistentVolumeClaim: { claimName: prometheus }
        - name: config
          configMap: { name: prometheus-config }
        - name: rules
          configMap: { name: prometheus-rules }
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app.kubernetes.io/name: prometheus
spec:
  selector:
    app.kubernetes.io/name: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: 9090
