# T073: In-cluster generator Job to create Grafana admin Secret with random credentials
apiVersion: batch/v1
kind: Job
metadata:
  name: grafana-admin-secret-generator
  namespace: monitoring
spec:
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: grafana-secret-generator
      containers:
      - name: generator
        # Pinned Kind node image (kind.node_image in versions.lock.yaml): carries
        # kubectl + bash; no external registry pull required for the generator.
        image: kindest/node@sha256:28b7cbb993dfe093c76641a0c95807637213c9109b761f1d422c2400e22b8e87
        command: ["/bin/bash","-c"]
        args:
        - |
          set -euo pipefail
          # Generate non-default random admin credentials and store only in Secret
          USER=$(cat /proc/sys/kernel/random/uuid | cut -c1-8)
          PASS=$(cat /proc/sys/kernel/random/uuid | cut -c1-16)
          kubectl -n monitoring create secret generic grafana-admin --dry-run=client \
            --from-literal=admin-user=$USER --from-literal=admin-password=$PASS -o yaml | kubectl apply -f -
          echo "grafana admin secret generated"
