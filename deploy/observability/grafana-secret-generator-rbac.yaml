# T073: RBAC for Grafana admin Secret generator in monitoring namespace
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana-secret-generator
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: grafana-secret-writer
  namespace: monitoring
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: grafana-secret-writer-binding
  namespace: monitoring
subjects:
- kind: ServiceAccount
  name: grafana-secret-generator
  namespace: monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: grafana-secret-writer
