# Phase 2 (T036-T050): The intent tier's cluster identity — RBAC and NetworkPolicy.
#
# This file is the FR-016 guardrail: the tier's two cluster API identities
# (intent-allocator, intent-deployer) cannot express a device action, and no
# tier pod can reach the containerlab management network 172.31.0.0/16.
# SC-005 is proven by attempting every denial in
# deploy/agents/tests/probes/rbac-denials.sh and observing "no"/timeout.
#
# Pod label convention used by the NetworkPolicies below (deployments set these):
#   every tier pod:        agentic-netops.io/tier: intent
#   allocator pod:         app: intent-allocator
#   deployer pod:          app: intent-deployer
#
# Source: plan.md Component 6 (verbatim), extended with the three
# no-token ServiceAccounts required by contracts/kubernetes-objects.md.
---
# T036/T037: the two tier namespaces, both labeled.
apiVersion: v1
kind: Namespace
metadata:
  name: agentic-netops-agents
  labels:
    agentic-netops.owner: agentic-netops
    agentic-netops.io/tier: intent
---
apiVersion: v1
kind: Namespace
metadata:
  name: agentic-netops-intent
  labels:
    agentic-netops.owner: agentic-netops
    agentic-netops.io/tier: intent
---
# T038: no-token identities. These workloads never talk to the cluster API:
# automountServiceAccountToken: false means no token is mounted at all, so a
# compromised supervisor, mapper, or UI pod holds no cluster credential.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: intent-supervisor
  namespace: agentic-netops-agents
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: intent-mapper
  namespace: agentic-netops-agents
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: intent-ui
  namespace: agentic-netops-agents
automountServiceAccountToken: false
---
# T039: the ONLY two token-bearing (cluster API) identities in the tier.
# Claim-only identity for the allocator. It has no service-intent or
# device-facing permissions.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: intent-allocator
  namespace: agentic-netops-agents
---
# The service-intent writer identity for Network, SRv6Service, and Event
# objects in agentic-netops-intent.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: intent-deployer
  namespace: agentic-netops-agents
---
# T040/T041: write access to the tier's own service intent, in the tier's own
# namespace only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: intent-writer
  namespace: agentic-netops-intent
rules:
- apiGroups: ["network.kubenet.dev"]
  resources: ["networks"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["agentic-netops.io"]
  resources: ["srv6services"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create"]
# Deliberately absent: secrets, configmaps, pods, pods/exec, nodes,
# config.sdcio.dev/*, inv.sdcio.dev/targets, and every resource in kubenet-system.
---
# T042: bind the writer Role to the deployer identity only.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: intent-writer
  namespace: agentic-netops-intent
subjects:
- kind: ServiceAccount
  name: intent-deployer
  namespace: agentic-netops-agents
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: intent-writer
---
# T043: claim and release identifiers from the existing authority.
# No update/patch: the tier can claim and release, but cannot retarget an
# existing claim (Decision 11).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kuid-claimer
  namespace: kuid-system
rules:
- apiGroups: ["id.kuid.dev"]
  resources: ["claims"]
  verbs: ["get", "list", "watch", "create", "delete"]
# T032 (gates/proofs/t032-kuid-claim-status.api.log): the pinned
# ghcr.io/kuidio/kuid-server:v0.0.13 serves the *.be.kuid.dev groups, not
# id.kuid.dev — the claim client therefore needs the same verb set on the
# served claim resources (same verbs: no update/patch anywhere).
- apiGroups: ["ipam.be.kuid.dev"]
  resources: ["ipclaims"]
  verbs: ["get", "list", "watch", "create", "delete"]
- apiGroups: ["genid.be.kuid.dev"]
  resources: ["genidclaims"]
  verbs: ["get", "list", "watch", "create", "delete"]
- apiGroups: ["as.be.kuid.dev"]
  resources: ["asclaims"]
  verbs: ["get", "list", "watch", "create", "delete"]
- apiGroups: ["vlan.be.kuid.dev"]
  resources: ["vlanclaims"]
  verbs: ["get", "list", "watch", "create", "delete"]
- apiGroups: ["extcomm.be.kuid.dev"]
  resources: ["extcommclaims"]
  verbs: ["get", "list", "watch", "create", "delete"]
# Fallback for the pinned kuid-server GENID/EXTCOMM defect on Kubernetes 1.31:
# one Lease per allocated ID, still scoped to claim/release semantics only.
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["get", "list", "watch", "create", "delete"]
# Deliberately absent: ipindexes, vniindexes, asnindexes, secrets, configmaps,
# and update/patch on every claim/lease resource above.
---
# T044: bind the claim identity to the allocator only.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kuid-claimer
  namespace: kuid-system
subjects:
- kind: ServiceAccount
  name: intent-allocator
  namespace: agentic-netops-agents
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kuid-claimer
---
# T051-T054 support: the secret generator Job (deploy/agents/secret-generator-job.yaml)
# needs to populate Secrets in agentic-netops-agents without holding any other
# permission. Narrow Role + binding for that Job's identity only.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: intent-secret-generator
  namespace: agentic-netops-agents
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: secret-generator
  namespace: agentic-netops-agents
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: secret-generator
  namespace: agentic-netops-agents
subjects:
- kind: ServiceAccount
  name: intent-secret-generator
  namespace: agentic-netops-agents
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: secret-generator
---
# T045: baseline — nothing in or out. Any pod in the tier namespace with no
# matching allowance gets zero ingress and zero egress. Mirrors
# deploy/rbac/base.yaml's deny-all-by-default.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all-by-default
  namespace: agentic-netops-agents
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
# Ingress to the operator UI. deny-all-by-default denies ALL ingress, and the
# only other Ingress policy in this namespace is slim-ingress (for the gateway),
# so nothing admitted traffic to the UI at all. Inert while the CNI ignored
# NetworkPolicy (kind v0.22's kindnetd); under the pinned kindnetd v20250214 the
# NodePort connection is dropped and the browser reports ERR_EMPTY_RESPONSE with
# the pod healthy and serving HTML on 127.0.0.1:3000 (observed 2026-09-04).
#
# The source is deliberately unrestricted: this is a NodePort service reached
# from the operator's browser on the host, so the traffic arrives post-SNAT from
# the node, not from any selectable pod or namespace. The allowance is confined
# to the UI pod on its single HTTP port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ui-ingress
  namespace: agentic-netops-agents
spec:
  podSelector:
    # The UI pod is labelled app.kubernetes.io/name, NOT `app` like the workers
    # (deploy/agents/ui.yaml). Selecting `app: ui` here matches nothing and the
    # policy silently admits nothing -- the same failure mode that made
    # apiserver-egress-cluster-clients a no-op.
    matchLabels:
      app.kubernetes.io/name: intent-ui
  policyTypes: ["Ingress"]
  ingress:
  - ports:
    - protocol: TCP
      port: 3000
---
# Ingress to the supervisor and the workers from inside the tier: the UI calls
# the supervisor, and the /v1/health readiness probes the supervisor runs against
# each worker are pod-to-pod. Same reason as above -- without an explicit
# allowance deny-all-by-default drops them.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tier-intra-ingress
  namespace: agentic-netops-agents
spec:
  podSelector:
    matchLabels:
      agentic-netops.io/tier: intent
  policyTypes: ["Ingress"]
  ingress:
  # Unrestricted BETWEEN tier pods, deliberately mirroring T047's intra-tier
  # egress rule, which is likewise portless. An enumerated port list here is a
  # maintenance trap: the first version listed only 9090-9093 and silently broke
  # the agent collector, which needs ClickHouse on 9000/8123 -- the collector
  # started, failed to reach its exporter and exited 2 with no useful log.
  # The tier boundary is what deny-all-by-default enforces; inside it, the pods
  # already talk over SLIM, OTLP and ClickHouse on several ports.
  - from:
    - podSelector:
        matchLabels:
          agentic-netops.io/tier: intent
---
# T046-T049: the complete egress budget for tier pods. The device management
# network is unreachable from every tier pod — the concrete, attemptable
# denial behind SC-005's third clause (deploy/agents/tests/probes/mgmt-network-denial.sh).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-scoped
  namespace: agentic-netops-agents
spec:
  podSelector:
    matchLabels:
      agentic-netops.io/tier: intent
  policyTypes: ["Egress"]
  egress:
  # T046: DNS only (cluster DNS lives in kube-system).
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  # T047: intra-tier traffic (SLIM gateway + worker peers).
  - to:
    - podSelector:
        matchLabels:
          agentic-netops.io/tier: intent
  # T048: OTLP over gRPC to the tier-owned collector in agentic-netops-system.
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: agentic-netops-system
      podSelector:
        matchLabels:
          app.kubernetes.io/name: otel-collector
    ports:
    - protocol: TCP
      port: 4317
  # T049: model-provider TLS only. The except list carves out the containerlab
  # management subnet (172.31.0.0/16, SONiC nodes .11/.12/.21/.22) plus the
  # RFC1918 lab ranges — even for port 443.
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
        except:
        - 172.31.0.0/16
        - 10.0.0.0/8
        - 192.168.0.0/16
    ports:
    - protocol: TCP
      port: 443
---
# T050: Kubernetes API egress is admitted for the allocator and deployer pods
# ONLY. The supervisor, mapper, and UI hold no token (T038) and no API egress;
# the slim gateway and collector do not need the API either.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: apiserver-egress-cluster-clients
  namespace: agentic-netops-agents
#
# REPAIRED 2026-09-03. As written this policy matched nothing and permitted
# nothing, and both faults were invisible while the CNI ignored NetworkPolicy
# (kind v0.22's kindnetd); the pinned kindnetd v20250214 enforces it, and the
# allocator's KUID claims started failing with "dial tcp 10.96.0.1:443:
# i/o timeout".
#   1. The selector read `app In (intent-allocator, intent-deployer)`, but the
#      pods are labelled `app: allocator` / `app: deployer` -- it selected zero
#      pods. It now selects on an explicit opt-in label instead, so a workload
#      that needs the API server declares it where the workload is defined.
#   2. The destination was `namespaceSelector: kube-system` on 443. The API
#      server is a hostNetwork static pod behind a Service ClusterIP that DNATs
#      to the node address, so no namespace/pod selector can ever match it, and
#      the matched port is 6443, not 443. It is now an ipBlock on the two API
#      ports, minus the pinned containerlab management subnet -- which keeps
#      SC-005's device-network denial intact (verified: API server 200,
#      172.31.0.21 still times out).
spec:
  podSelector:
    matchLabels:
      agentic-netops.io/needs-apiserver: "true"
  policyTypes: ["Egress"]
  egress:
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
        except:
        - 172.31.0.0/16
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 6443
