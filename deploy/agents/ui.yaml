# deploy/agents/ui.yaml — UI Deployment and Service (port 3000)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  namespace: ainetops-agents
  labels:
    app.kubernetes.io/name: intent-ui
    app.kubernetes.io/component: ui
    ainetops.owner: ainetops
    ainetops.io/tier: intent
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: intent-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: intent-ui
        app.kubernetes.io/component: ui
        ainetops.owner: ainetops
        ainetops.io/tier: intent
    spec:
      automountServiceAccountToken: false  # T301
      serviceAccountName: intent-ui
      containers:
      - name: ui
        image: ainetops/intent-ui:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: ui-env
        ports:
        - name: http
          containerPort: 3000
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 3
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 3
          periodSeconds: 10
        resources:
          # The UI image runs a full `vite build` at container start (30+ seconds,
          # 30 modules) before it serves anything, and Node's build peak does not
          # fit in 256Mi: the container was OOMKilled (exit 137) mid-serve and went
          # CrashLoopBackOff after 6 restarts, with the build log ending cleanly at
          # "serving UI on port 3000..." each time -- so the logs looked healthy and
          # only the exit code showed the kill (2026-09-03).
          requests: { cpu: "100m", memory: "256Mi" }
          limits: { cpu: "1000m", memory: "1Gi" }
---
apiVersion: v1
kind: Service
metadata:
  name: ui
  namespace: ainetops-agents
  labels:
    app.kubernetes.io/name: intent-ui
    app.kubernetes.io/component: ui
    ainetops.owner: ainetops
    ainetops.io/tier: intent
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: intent-ui
  ports:
  - name: http
    port: 3000
    targetPort: http
    protocol: TCP
    nodePort: 30000
