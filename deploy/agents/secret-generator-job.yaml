# T051-T054: in-cluster generator Job for the intent tier's Secrets.
#
# Reuses the pattern from deploy/rbac/secret-generator-job.yaml (feature 001): the
# pinned Kind node image (kubectl + openssl + bash, no external registry pull),
# key-aware idempotence (generate when a key is MISSING or EMPTY, never rotate a
# populated secret), and no credential literal anywhere in Git — REVERSE.md
# Finding 4 (research.md Decision 14): every credential is generated at runtime.
#
# Generated Secrets (all in agentic-netops-agents):
#   slim-gateway   T052  key PASSWORD                 — SLIM gateway password (FR-024)
#   slim-tls       T053  keys ca.crt, server.crt, server.key,
#                        {supervisor,mapper,allocator,deployer}.{crt,key}
#                                — SLIM CA + server cert + per-agent client certs
#                                  (Decision 6: mTLS, client_ca_file verified on 0.6.1)
#   clickhouse-auth T054  keys username, password      — agent-analytics sink, never admin/admin
#
# Identity: ServiceAccount/Role/RoleBinding intent-secret-generator (namespace-rbac.yaml),
# scoped to secrets in agentic-netops-agents only. The Job runs with no other permission.
apiVersion: batch/v1
kind: Job
metadata:
  name: intent-secret-generator
  namespace: agentic-netops-agents
  labels:
    agentic-netops.owner: agentic-netops
    agentic-netops.io/tier: intent
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        agentic-netops.owner: agentic-netops
        agentic-netops.io/tier: intent
        app: intent-secret-generator
    spec:
      restartPolicy: OnFailure
      # automount stays true ONLY because the Job needs its API token to write the
      # Secrets (its Role is limited to that). The agent workloads mount no token.
      serviceAccountName: intent-secret-generator
      containers:
      - name: generator
        # Pinned Kind node image (kind.node_image in versions.lock.yaml): carries
        # kubectl + openssl, no external pull needed (reproducible air-gapped).
        image: kindest/node@sha256:3abb816a5b1061fb15c6e9e60856ec40d56b7b52bcea5f5f1350bc6e2320b6f8
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -euo pipefail
          NS=agentic-netops-agents

          # Shared idempotence helper, same key-aware rule as the 001 generator:
          # a secret with ALL required keys non-empty is left untouched (rotating
          # populated creds would desynchronize TLS clients / DB users); a secret
          # that is missing or has EMPTY keys is (re)generated.
          secret_has_keys() { # <secret> <key> [<key> ...]
            local s=$1; shift
            local k
            for k in "$@"; do
              v=$(kubectl -n "$NS" get secret "$s" -o jsonpath="{.data.$k}" 2>/dev/null || true)
              [[ -z "$v" ]] && return 1
            done
            return 0
          }

          # ------------------------------------------------------------------
          # T052: SLIM gateway password (Secret/slim-gateway, key PASSWORD).
          # FR-024: the gateway refuses unauthenticated registration; the password
          # is a generated secret, never a literal (the subject's docker-compose
          # shell default is not carried forward).
          # ------------------------------------------------------------------
          if secret_has_keys slim-gateway PASSWORD; then
            echo "slim-gateway populated; not rotating"
          else
            PASS=$(openssl rand -hex 24)
            kubectl -n "$NS" create secret generic slim-gateway --dry-run=client \
              --from-literal=PASSWORD="$PASS" -o yaml | kubectl apply -f -
            echo "slim-gateway generated"
          fi

          # ------------------------------------------------------------------
          # T053: SLIM CA + server cert + per-agent client certs (Secret/slim-tls).
          # Decision 6 (qualified on ghcr.io/agntcy/slim:0.6.1): the gateway
          # dataplane server uses tls: {insecure: false, cert_file, key_file,
          # client_ca_file} — client-certificate verification. The CA signs the
          # server cert (SAN: the Service DNS names) and one client cert per
          # agent identity; each agent mounts its own pair + the CA.
          # ------------------------------------------------------------------
          if secret_has_keys slim-tls ca.crt server.crt server.key \
              supervisor.crt supervisor.key mapper.crt mapper.key \
              allocator.crt allocator.key deployer.crt deployer.key; then
            echo "slim-tls populated; not rotating"
          else
            W=$(mktemp -d)
            trap 'rm -rf "$W"' EXIT
            # CA (the client_ca_file the gateway verifies workers against).
            openssl req -x509 -nodes -newkey rsa:2048 -keyout "$W/ca.key" -out "$W/ca.crt" \
              -subj "/CN=agentic-netops-intent-tier-slim-ca" -days 365
            # Server cert for the gateway (0.0.0.0:46357); SANs are the
            # deterministic in-cluster DNS names a worker resolves.
            # NOTE: the config is written with printf (NOT a bash heredoc):
            # a heredoc delimiter inside this YAML block scalar can never sit
            # at column 0, so the shell sees no terminator (this was a latent
            # syntax bug — the Job ran, "unexpected end of file").
            printf '%s\n' \
              '[req]' \
              'distinguished_name = dn' \
              'req_extensions = ext' \
              'prompt = no' \
              '[dn]' \
              'CN = slim.agentic-netops-agents.svc' \
              '[ext]' \
              'subjectAltName = DNS:slim.agentic-netops-agents.svc,DNS:slim.agentic-netops-agents.svc.cluster.local,DNS:slim,IP:127.0.0.1' \
              'keyUsage = digitalSignature, keyEncipherment' \
              'extendedKeyUsage = serverAuth' \
              > "$W/server.cnf"
            openssl req -nodes -newkey rsa:2048 -keyout "$W/server.key" -out "$W/server.csr" \
              -config "$W/server.cnf"
            openssl x509 -req -in "$W/server.csr" -CA "$W/ca.crt" -CAkey "$W/ca.key" \
              -CAcreateserial -out "$W/server.crt" -days 365 -extensions ext -extfile "$W/server.cnf"
            # One client cert per agent identity (clientAuth). CN is the agent
            # name; SLIM authenticates by CA membership — the per-agent pairs
            # keep credential blast radius per workload.
            for a in supervisor mapper allocator deployer; do
              openssl req -nodes -newkey rsa:2048 -keyout "$W/$a.key" -out "$W/$a.csr" \
                -subj "/CN=$a"
              openssl x509 -req -in "$W/$a.csr" -CA "$W/ca.crt" -CAkey "$W/ca.key" \
                -CAcreateserial -out "$W/$a.crt" -days 365 \
                -extfile <(printf "extendedKeyUsage=clientAuth\nkeyUsage=digitalSignature")
            done
            kubectl -n "$NS" create secret generic slim-tls --dry-run=client \
              --from-file=ca.crt="$W/ca.crt" \
              --from-file=server.crt="$W/server.crt" --from-file=server.key="$W/server.key" \
              --from-file=supervisor.crt="$W/supervisor.crt" --from-file=supervisor.key="$W/supervisor.key" \
              --from-file=mapper.crt="$W/mapper.crt" --from-file=mapper.key="$W/mapper.key" \
              --from-file=allocator.crt="$W/allocator.crt" --from-file=allocator.key="$W/allocator.key" \
              --from-file=deployer.crt="$W/deployer.crt" --from-file=deployer.key="$W/deployer.key" \
              -o yaml | kubectl apply -f -
            echo "slim-tls generated"
          fi

          # ------------------------------------------------------------------
          # T054: ClickHouse credentials (Secret/clickhouse-auth).
          # REVERSE.md Finding 4: the subject ran admin/admin (docker-compose
          # 43-44, 85, 155-156); the tier never does. The collector's
          # clickhouse exporter and the StatefulSet both read this Secret
          # (telemetry.yaml); no literal in any manifest.
          # ------------------------------------------------------------------
          if secret_has_keys clickhouse-auth username password; then
            echo "clickhouse-auth populated; not rotating"
          else
            USER="intent_analytics"
            PASS=$(openssl rand -hex 18)
            kubectl -n "$NS" create secret generic clickhouse-auth --dry-run=client \
              --from-literal=username="$USER" --from-literal=password="$PASS" -o yaml | kubectl apply -f -
            echo "clickhouse-auth generated"
          fi

          echo "intent-secret-generator: done"
