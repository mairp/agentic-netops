# deploy/agents/allocator.yaml — the allocator worker agent (US3).
#
# T179: Deployment/allocator + Service/allocator on 9091/TCP (the subject's port,
# contracts/supervisor-http.md), liveness/readiness probes on the deep
# `GET /v1/health` (a real A2A session probe over SLIM — "alive" means the
# worker can be reached, not merely that the process is up), and lab-sized
# resources (requests 50m/128Mi, limits 500m/512Mi) for the kind lab.
#
# The worker registers with the SLIM gateway over TRANSPORT_SERVER_ENDPOINT
# (server.py run_transport); SLIM-only is enforced in code (require_slim).
# The service account IS token-bearing: T039 names intent-allocator one of the
# only two cluster-API identities in the tier, because the allocator claims its
# identifiers from KUID rather than inventing them (FR-013). The mount carries
# both halves of that identity — the bearer token AND the cluster CA bundle the
# client verifies the API server against. Turning the mount off leaves the
# allocator with no credential and no trust anchor, and every claim fails with
# CERTIFICATE_VERIFY_FAILED. The RoleBinding (kuid-claimer, in kuid-system)
# holds the blast radius: claim and release, no update/patch, nothing else.
---
apiVersion: v1
kind: Service
metadata:
  name: allocator
  namespace: agentic-netops-agents
  labels:
    agentic-netops.owner: agentic-netops
    agentic-netops.io/tier: intent
spec:
  selector:
    app: allocator
  ports:
    - name: http
      port: 9091
      targetPort: 9091
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: allocator
  namespace: agentic-netops-agents
  labels:
    agentic-netops.owner: agentic-netops
    agentic-netops.io/tier: intent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: allocator
  template:
    metadata:
      labels:
        app: allocator
        agentic-netops.owner: agentic-netops
        agentic-netops.io/tier: intent
        # Selected by allow-apiserver-egress (namespace-rbac.yaml): the allocator
        # claims identifiers from KUID through the API server's aggregation layer,
        # so it needs egress past deny-all-by-default. It is the only worker that does.
        agentic-netops.io/needs-apiserver: "true"
    spec:
      serviceAccountName: intent-allocator
      automountServiceAccountToken: true
      containers:
        - name: allocator
          image: agentic-netops/intent-allocator:latest
          imagePullPolicy: IfNotPresent
          # FR-024: the gateway verifies client certificates; the pinned SDK
          # cannot present one, so the container front-ends it with a
          # pod-local mTLS proxy (docker/mtls-proxy.sh) presenting this
          # agent's certificate from Secret/slim-tls.
          command: ["/bin/bash", "/app/docker/mtls-proxy.sh"]
          args: ["python", "provisioning/allocator/server.py"]
          ports:
            - name: http
              containerPort: 9091
          env:
            # Point the OpenTelemetry SDK at the tier-owned collector. Its default is
            # localhost:4318, which does not exist in the pod -- the agents export on
            # startup and treat a failed export as FATAL, so every one of them sat in
            # CrashLoopBackOff (mapper/allocator at 29 restarts, deployer 31) with
            # ConnectionError to localhost:4318, while their own /v1/health returned 200.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://agent-otel-collector.agentic-netops-agents.svc:4318
            - name: AGENT_OTLP_HTTP_ENDPOINT
              value: http://agent-otel-collector.agentic-netops-agents.svc:4318
            - name: SLIM_TLS_DIR
              value: /etc/slim/tls
            - name: SLIM_CLIENT_NAME
              value: allocator
            - name: SLIM_UPSTREAM
              value: slim.agentic-netops-agents.svc:46357
            - name: ENABLE_HTTP
              value: "true"
            - name: DEFAULT_MESSAGE_TRANSPORT
              value: "SLIM"
            # The transport reaches the gateway through the pod-local proxy.
            - name: TRANSPORT_SERVER_ENDPOINT
              value: "http://127.0.0.1:46357"
          # Trivial liveness (process up); a transport outage degrades
          # /v1/health readiness (named 503) instead of killing the pod.
          livenessProbe:
            httpGet:
              path: /health
              port: 9091
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /v1/health
              port: 9091
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 1000m
              # 512Mi -> 1Gi. These agents load LangGraph, the OpenTelemetry SDK and
              # an LLM client at import time; the startup peak does not fit in 512Mi
              # and every one of them was OOMKilled (exit 137) on a loop --
              # mapper/allocator reached 29 restarts and deployer 31, while their own
              # /v1/health returned 200 right up to the kill, so the pods looked alive
              # and the supervisor only reported "readiness degraded" (2026-09-03).
              memory: 1Gi
          volumeMounts:
            - name: slim-tls
              mountPath: /etc/slim/tls
              readOnly: true
      volumes:
        - name: slim-tls
          secret:
            secretName: slim-tls
            items:
              - key: ca.crt
                path: ca.crt
              - key: allocator.crt
                path: allocator.crt
              - key: allocator.key
                path: allocator.key
