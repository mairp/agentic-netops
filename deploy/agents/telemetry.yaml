# T035: tier telemetry pipeline — one emission, three sinks (research.md Decision 8).
#
# Agents emit OTLP exactly ONCE, to this tier-owned collector
# (http://agent-otel-collector.agentic-netops-agents.svc:4318, OTLP/HTTP). This collector
# is the single fan-out point: a clickhouse exporter into the tier's agent-analytics
# store, an otlp exporter forwarding to feature 001's unmodified collector at
# otel-collector.agentic-netops-system:4317, and an otlphttp/phoenix exporter forwarding
# TRACES to the host-side agent-observability-stack collector (Arize Phoenix trace
# backend, UI on host :3006) — the only sink that sees traces from this tier outside
# the cluster. No feature-001 file changes.
#
# ---------------------------------------------------------------------------
# NOTE (2026-10-11, Phoenix trace work): the shape below was qualified from
# isolated SDK entrypoints. Live spans from the running tier are
# OpenInference-NATIVE (ioa-observe is a rebranded Traceloop SDK):
# ChatLiteLLM.chat carries gen_ai.prompt/completion + gen_ai.usage.* /
# llm.usage.* tokens; the agentic-netops.* attributes stamped in
# agents/common/llm.py do not reach exported spans (SDK context scoping),
# so source-side redaction is inert. Verified live shape + mapping:
# prompts/PHOENIX_TRACES_PROMPT.md (Grounding) and the AOS
# transform/phoenix_agentic_netops.
#
# QUALIFIED OTLP SHAPE (T034) — captured live from the pinned
# ioa-observe-sdk==1.0.24 (agents/.venv) by POSTing the subject's own
# instrumentation entrypoints (Observe.init, @agent, @graph, session_start)
# at a local OTLP/HTTP sink. Full capture + decoded payload:
#   .wiggum/features/002-agntcy-intent-tier/gates/proofs/t034-otlp-shape.log
#
# Transport:
#   POST {IOA_OBSERVE_BASE_URL}/v1/traces
#   Content-Type: application/x-protobuf
#   Content-Encoding: gzip
#   Authorization: Bearer <IOA_OBSERVE key>
#
# Resource attributes (per resource_spans):
#   service.name = the app_name passed to Observe.init (per agent workload)
#
# Instrumentation scope names observed:
#   ioa_observe.sdk.tracing.tracing   (session spans, e.g. set_session_id)
#   ioa_observe.sdk.decorators.base   (agent_start_event / agent_end_event)
#   ioa.observe.tracer                (the decorated spans)
#
# Span shape:
#   "<name>.agent"  (from @agent(name=...)) and "<name>.graph" (from @graph(name=...))
#   attributes:
#     ioa_observe.span.kind        = "agent" | "graph"
#     ioa_observe.entity.name      = the decorator name
#     ioa_observe.entity.input     = JSON-encoded call input (string)
#     ioa_observe.entity.output    = JSON-encoded call output (string)
#     ioa_observe.workflow.name    = the workflow/agent name
#     session.id                   = "<agent>_<uuid>" — the per-session join key
#     agent_id                     = the agent name (agent spans only)
#     execution.success            = bool
#     ioa_start_time               = float (epoch seconds)
#     agent_chain_start_time       = float (agent spans only)
#   The W3C trace_id on every span (32 lowercase hex) is the correlation
#   identifier per research.md Decision 9; the collector needs no custom
#   processing to keep it — it is standard span baggage.
#
# Consequences for this file:
#   - the pipeline carries TRACES (the SDK's decorated path emits spans, not
#     metrics, in the qualified run); a metrics pipeline is configured too,
#     because the SDK's MetricsWrapper can emit standard OTLP metrics and the
#     plan names them agentic_netops_agent_* so they pass feature 001's filter
#     processor regexp (.*sonic_.*, .*srv6.*, .*agentic-netops.*) unchanged.
#   - the clickhouse exporter needs the generated Secret clickhouse-auth
#     (T054) — never admin/admin (REVERSE.md Finding 4).
# ---------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-otel-config
  namespace: agentic-netops-agents
  labels:
    agentic-netops.owner: agentic-netops
    agentic-netops.io/tier: intent
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          # T034: the SDK speaks OTLP/HTTP (POST /v1/traces, protobuf+gzip).
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
            cors:
              allowed_origins: ["*"]

    processors:
      batch: {}

    # The single fan-out point (Decision 8): two exporters, one emission.
    exporters:
      clickhouse:
        endpoint: "tcp://clickhouse.agentic-netops-agents.svc:9000"
        database: agent_analytics
        traces_table_name: traces
        metrics_table_name: metrics
        timeout: 10s
        # ${env:VAR}, not the `env_var:` map form. This collector version rejects
        # the map outright -- "'password' expected type configopaque.String, got
        # unconvertible type map[string]interface {}" -- so the collector never
        # started, which took the whole agent tier down with it: every agent exports
        # OTLP on startup and treats a failed export as fatal, so mapper, allocator
        # and deployer all landed in CrashLoopBackOff (2026-09-03). The env vars
        # themselves were already injected correctly from the clickhouse-auth Secret.
        username: ${env:CLICKHOUSE_USERNAME}
        password: ${env:CLICKHOUSE_PASSWORD}
        # T351: queue/retry for ClickHouse outages
        sending_queue:
          enabled: true
          num_consumers: 4
          queue_size: 5000
        retry_on_failure:
          enabled: true
          max_elapsed_time: 5m
      otlp/feature001:
        # Forward to feature 001's collector, which already accepts OTLP on
        # :4317 and exports to Prometheus. Its filter processor keeps
        # metrics matching .*sonic_.*|.*srv6.*|.*agentic-netops.*, so every tier
        # metric is named agentic_netops_agent_* (plan.md Component 8).
        endpoint: otel-collector.agentic-netops-system.svc:4317
        tls:
          insecure: true
        # T352: queue/retry for upstream OTLP outages
        sending_queue:
          enabled: true
          num_consumers: 4
          queue_size: 5000
        retry_on_failure:
          enabled: true
          max_elapsed_time: 5m
      otlphttp/phoenix:
        # Third sink (traces only): the host-side agent-observability-stack collector
        # (docker compose; Arize Phoenix 20.x + Postgres). From inside kind the docker
        # host is the bridge gateway, so the default targets its host-published OTLP/HTTP
        # port; the exporter appends /v1/traces. Override AOS_OTLP_HTTP_ENDPOINT when the
        # stack runs elsewhere. Same queue/retry posture as T351/T352: a down stack
        # buffers here and never back-pressures the receiver, so the agents are
        # unaffected (they only see a failure if THIS collector pod is down, as before).
        endpoint: ${env:AOS_OTLP_HTTP_ENDPOINT}
        compression: gzip
        sending_queue:
          enabled: true
          num_consumers: 4
          queue_size: 5000
        retry_on_failure:
          enabled: true
          max_elapsed_time: 5m

    # health_check must exist: the Deployment's liveness AND readiness probes both
    # target port 13133, which is this extension's port. Without it nothing listens
    # there, the liveness probe fails, kubelet SIGTERMs the collector, and it shuts
    # down cleanly -- so the pod restarts forever with Exit Code 0 / Reason
    # "Completed", which reads like a normal exit rather than a failure.
    #
    # That loop took the whole agent tier with it (2026-09-03): every agent exports
    # OTLP on startup and treats a failed export as fatal, so each time this
    # collector went down mapper, allocator and deployer crashed too, and the
    # supervisor reported "readiness degraded: mapper/allocator/deployer
    # unreachable" while each of those pods' own /v1/health returned 200.
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
    service:
      extensions: [health_check]
      pipelines:
        # Traces fan out to all three sinks; metrics stay on the two established ones
        # (Phoenix is a trace backend — its metrics pipeline is not fed from this tier).
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [clickhouse, otlp/feature001, otlphttp/phoenix]
        metrics:
          receivers: [otlp]
          processors: [batch]
          exporters: [clickhouse, otlp/feature001]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-otel-collector
  namespace: agentic-netops-agents
  labels:
    agentic-netops.owner: agentic-netops
    agentic-netops.io/tier: intent
    app: agent-otel-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-otel-collector
  template:
    metadata:
      labels:
        # agentic-netops.io/tier: intent — the pod is addressed by the
        # allow-egress-scoped and apiserver-egress-cluster-clients policies
        # in namespace-rbac.yaml like every other tier pod.
        agentic-netops.owner: agentic-netops
        agentic-netops.io/tier: intent
        app: agent-otel-collector
    spec:
      # The collector talks to the 001 collector and ClickHouse, not the API
      # server; it holds no token.
      automountServiceAccountToken: false
      containers:
      - name: collector
        # Pinned by digest (versions.lock.yaml tooling.otel_collector).
        image: otel/opentelemetry-collector-contrib@sha256:e07e325e303e86f4a87a617491e921b579a92da6d404007394757ac910bf9587
        args: ["--config=/etc/otel/config.yaml"]
        ports:
        - {name: otlp-grpc, containerPort: 4317}
        - {name: otlp-http, containerPort: 4318}
        env:
        - name: CLICKHOUSE_USERNAME
          valueFrom:
            secretKeyRef: {name: clickhouse-auth, key: username}
        - name: CLICKHOUSE_PASSWORD
          valueFrom:
            secretKeyRef: {name: clickhouse-auth, key: password}
        # The otlphttp/phoenix exporter references ${env:AOS_OTLP_HTTP_ENDPOINT} in the
        # ConfigMap; if the variable were ever missing the collector would refuse to
        # start (same failure class as the clickhouse-auth incident above, which took
        # the whole tier down). The env entry is therefore part of the manifest, with
        # the lab default inline: from inside kind the docker host is bridge gateway
        # 172.17.0.1, and the agent-observability-stack stack publishes OTLP/HTTP on
        # host :4318. Override the value when that stack runs elsewhere.
        - name: AOS_OTLP_HTTP_ENDPOINT
          value: "http://172.17.0.1:4318"
        # Nothing else creates this database. The OTLP exporter below targets
        # `database: agent_analytics` and fails its pipeline startup without it --
        # "cannot start pipelines: create database: code: 81, message: Database
        # agent_analytics does not exist" -- so the collector exits 2 in a
        # CrashLoopBackOff (observed 2026-09-04 on the rebuilt cluster). The image
        # creates CLICKHOUSE_DB during first-boot initialization, which is the only
        # point in the lifecycle that runs before the collector connects.
        # NOTE: first-boot only -- it is a no-op against an already-populated PVC,
        # so an existing volume needs the database created by hand once.
        - name: CLICKHOUSE_DB
          value: agent_analytics
        volumeMounts:
        - {name: config, mountPath: /etc/otel}
        readinessProbe:
          httpGet: {path: /, port: 13133}
          initialDelaySeconds: 5
        livenessProbe:
          httpGet: {path: /, port: 13133}
          initialDelaySeconds: 10
      volumes:
      - name: config
        configMap:
          name: agent-otel-config
---
apiVersion: v1
kind: Service
metadata:
  name: agent-otel-collector
  namespace: agentic-netops-agents
  labels:
    agentic-netops.owner: agentic-netops
    agentic-netops.io/tier: intent
spec:
  selector:
    app: agent-otel-collector
  ports:
  - {name: otlp-grpc, port: 4317, targetPort: 4317}
  - {name: otlp-http, port: 4318, targetPort: 4318}
---
# The agent-analytics sink. Single-replica StatefulSet with a PVC; the
# password comes from the generated Secret clickhouse-auth (T054) — never a
# literal, never admin/admin (REVERSE.md Finding 4).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: clickhouse
  namespace: agentic-netops-agents
  labels:
    agentic-netops.owner: agentic-netops
    agentic-netops.io/tier: intent
    app: clickhouse
spec:
  replicas: 1
  serviceName: clickhouse
  selector:
    matchLabels:
      app: clickhouse
  template:
    metadata:
      labels:
        agentic-netops.owner: agentic-netops
        agentic-netops.io/tier: intent
        app: clickhouse
    spec:
      automountServiceAccountToken: false
      containers:
      - name: clickhouse
        # Pinned by digest (versions.lock.yaml intent_tier.clickhouse).
        image: clickhouse/clickhouse-server:24.9@sha256:efaa7d174383830fbe83a0589fc19804cc3581c628d663969d198d48822d3119
        ports:
        - {name: native, containerPort: 9000}
        - {name: http, containerPort: 8123}
        env:
        - name: CLICKHOUSE_USER
          valueFrom:
            secretKeyRef: {name: clickhouse-auth, key: username}
        - name: CLICKHOUSE_PASSWORD
          valueFrom:
            secretKeyRef: {name: clickhouse-auth, key: password}
        volumeMounts:
        - {name: data, mountPath: /var/lib/clickhouse}
        readinessProbe:
          tcpSocket: {port: 8123}
          initialDelaySeconds: 10
        livenessProbe:
          tcpSocket: {port: 8123}
          initialDelaySeconds: 30
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: clickhouse
  namespace: agentic-netops-agents
  labels:
    agentic-netops.owner: agentic-netops
    agentic-netops.io/tier: intent
spec:
  selector:
    app: clickhouse
  ports:
  - {name: native, port: 9000, targetPort: 9000}
  # Queried directly over :8123 (plan.md Component 8).
  - {name: http, port: 8123, targetPort: 8123}
---
# T338: dashboard ConfigMap for the intent tier (mounted into Grafana via scripts/lib/intent_tier.sh T339)
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-agents
  namespace: agentic-netops-agents
  labels:
    agentic-netops.owner: agentic-netops
    agentic-netops.io/tier: intent
    app.kubernetes.io/name: intent-grafana-dashboards
  annotations:
    description: Intent-tier Grafana dashboards published by the agents feature
data:
  intent-tier.json: |
    {
      "title": "Intent Tier",
      "uid": "intent-tier",
      "version": 1,
      "schemaVersion": 38,
      "panels": []
    }
