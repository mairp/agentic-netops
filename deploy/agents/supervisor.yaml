# deploy/agents/supervisor.yaml — the conversational supervisor (US3).
#
# T175: Deployment/supervisor with `replicas: 1` and `strategy: Recreate` —
# the SQLite checkpointer is a single-writer file on a ReadWriteOnce PVC, so
# two replicas can never share it, and a Recreate (never RollingUpdate)
# guarantees the old pod released the SQLite file before the new one starts.
# T176: Service/supervisor (9090), PVC/supervisor-checkpoint,
# ConfigMap/supervisor-prompts. Secret/llm-provider is declared separately in
# llm-provider-secret.yaml so applying this workload can never erase populated
# provider credentials; its keys are materialized at provision time.
# T177: liveness probe on the trivial `GET /health` (never touches the
# transport — a worker outage must not restart the supervisor into amnesia)
# and readiness on the deep `GET /v1/health` (probe every worker, name the
# unavailable one — FR-026).
# T170: the PVC is mounted at /state/supervisor-checkpoint and
# SUPERVISOR_CHECKPOINT_DB points at the SQLite file inside it
# (graph.py CHECKPOINT_DB_PATH), so LangGraph checkpoints survive a restart.
#
# Lab-sized resources (requests 100m/256Mi, limits 1/1Gi) fit the kind lab.
apiVersion: v1
kind: ConfigMap
metadata:
  name: supervisor-prompts
  namespace: agentic-netops-agents
  labels:
    agentic-netops.owner: agentic-netops
    agentic-netops.io/tier: intent
data:
  suggested_prompts.json: |
    [
      "Provision a point-to-point 1G VPWS between leaf01 ethernet1 and leaf02 ethernet2 for tenant acme",
      "Create a full-mesh VPLS between leaf01 ethernet3 and leaf02 ethernet4 for tenant blue vlan 100",
      "Create an L3VPN between site-a wan1 and site-b wan1 for tenant initech",
      "Set up an IRB service between leaf01 ethernet5 and leaf02 ethernet6 for tenant umbrella vlan 200"
    ]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: supervisor-checkpoint
  namespace: agentic-netops-agents
  labels:
    agentic-netops.owner: agentic-netops
    agentic-netops.io/tier: intent
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: supervisor
  namespace: agentic-netops-agents
  labels:
    agentic-netops.owner: agentic-netops
    agentic-netops.io/tier: intent
spec:
  selector:
    app: supervisor
  ports:
    - name: http
      port: 9090
      targetPort: 9090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: supervisor
  namespace: agentic-netops-agents
  labels:
    agentic-netops.owner: agentic-netops
    agentic-netops.io/tier: intent
spec:
  # T175: single writer on the checkpoint SQLite file; Recreate, never
  # RollingUpdate (two pods would fight over the RWO-mounted SQLite file).
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: supervisor
  template:
    metadata:
      labels:
        app: supervisor
        agentic-netops.owner: agentic-netops
        agentic-netops.io/tier: intent
    spec:
      serviceAccountName: intent-supervisor
      automountServiceAccountToken: false
      containers:
        - name: supervisor
          image: agentic-netops/intent-supervisor:latest
          imagePullPolicy: IfNotPresent
          # FR-024: the gateway verifies client certificates; the pinned SDK
          # cannot present one, so the container front-ends it with a
          # pod-local mTLS proxy (docker/mtls-proxy.sh) presenting the
          # supervisor's certificate from Secret/slim-tls.
          command: ["/bin/bash", "/app/docker/mtls-proxy.sh"]
          # Run the baked-in venv directly: `uv run` re-syncs the environment
          # (dev deps included) from PyPI at every boot, which pod egress
          # policy does not guarantee — a slow/blocked sync blows the
          # liveness budget and crash-loops the pod before uvicorn binds.
          args: ["/app/.venv/bin/python", "supervisors/provisioning/main.py"]
          ports:
            - name: http
              containerPort: 9090
          env:
            # Point the OpenTelemetry SDK at the tier-owned collector. Its default is
            # localhost:4318, which does not exist in the pod -- the agents export on
            # startup and treat a failed export as FATAL, so every one of them sat in
            # CrashLoopBackOff (mapper/allocator at 29 restarts, deployer 31) with
            # ConnectionError to localhost:4318, while their own /v1/health returned 200.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://agent-otel-collector.agentic-netops-agents.svc:4318
            - name: AGENT_OTLP_HTTP_ENDPOINT
              value: http://agent-otel-collector.agentic-netops-agents.svc:4318
            - name: SLIM_TLS_DIR
              value: /etc/slim/tls
            - name: SLIM_CLIENT_NAME
              value: supervisor
            - name: SLIM_UPSTREAM
              value: slim.agentic-netops-agents.svc:46357
            - name: ENABLE_HTTP
              value: "true"
            - name: DEFAULT_MESSAGE_TRANSPORT
              value: "SLIM"
            # The transport reaches the gateway through the pod-local proxy.
            - name: TRANSPORT_SERVER_ENDPOINT
              value: "http://127.0.0.1:46357"
            - name: SUPERVISOR_CHECKPOINT_DB
              value: /state/supervisor-checkpoint/checkpoints.sqlite
            # LLM provider selection is the LLM_MODEL prefix alone
            # (common/llm.py); the credentials come from Secret/llm-provider.
            # The classifier runs through LiteLLM, which for an `openai/` LLM_MODEL prefix
            # reads OPENAI_API_KEY and OPENAI_BASE_URL from the environment. Only LLM_MODEL
            # and the OAUTH2_* keys were mapped, so LiteLLM resolved the model
            # (model=gpt-5, provider=openai) and then failed with "Missing credentials" on
            # every prompt. Both come from the same provision-time Secret; neither is ever
            # committed.
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: llm-provider
                  key: OPENAI_API_KEY
                  optional: true
            - name: OPENAI_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: llm-provider
                  key: OPENAI_BASE_URL
                  optional: true
            - name: LLM_MODEL
              valueFrom:
                secretKeyRef:
                  name: llm-provider
                  key: LLM_MODEL
                  optional: true
            - name: OAUTH2_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: llm-provider
                  key: OAUTH2_CLIENT_ID
                  optional: true
            - name: OAUTH2_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: llm-provider
                  key: OAUTH2_CLIENT_SECRET
                  optional: true
            - name: OAUTH2_TOKEN_URL
              valueFrom:
                secretKeyRef:
                  name: llm-provider
                  key: OAUTH2_TOKEN_URL
                  optional: true
            - name: OAUTH2_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: llm-provider
                  key: OAUTH2_BASE_URL
                  optional: true
            - name: OAUTH2_APPKEY
              valueFrom:
                secretKeyRef:
                  name: llm-provider
                  key: OAUTH2_APPKEY
                  optional: true
          # T177: trivial liveness on /health (no transport touch);
          # deep readiness on /v1/health (probes every worker).
          startupProbe:
            httpGet:
              path: /health
              port: 9090
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /health
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /v1/health
              port: 9090
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              # 1Gi proved marginal: the graph + SLIM runtime + streaming
              # LLM response together OOM-killed the pod (exit 137) during
              # a mapper round-trip.
              memory: 2Gi
          volumeMounts:
            # T170: the SQLite checkpoint file lives on the PVC.
            - name: checkpoint
              mountPath: /state/supervisor-checkpoint
            - name: prompts
              mountPath: /app/supervisors/provisioning/suggested_prompts.json
              subPath: suggested_prompts.json
              readOnly: true
            - name: slim-tls
              mountPath: /etc/slim/tls
              readOnly: true
      volumes:
        - name: checkpoint
          persistentVolumeClaim:
            claimName: supervisor-checkpoint
        - name: prompts
          configMap:
            name: supervisor-prompts
        - name: slim-tls
          secret:
            secretName: slim-tls
            items:
              - key: ca.crt
                path: ca.crt
              - key: supervisor.crt
                path: supervisor.crt
              - key: supervisor.key
                path: supervisor.key
