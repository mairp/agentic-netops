# deploy/agents/ui-configmap.yaml — UI runtime configuration (feature 002 US4)
#
# Provides Service DNS targets for the UI server's /api proxy. The browser only
# calls the UI's public origin, so it never needs to resolve cluster-local DNS.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ui-env
  namespace: agentic-netops-agents
  labels:
    agentic-netops.owner: agentic-netops
    agentic-netops.io/tier: intent
    app.kubernetes.io/name: intent-ui
    app.kubernetes.io/component: ui
    app.kubernetes.io/part-of: agentic-netops-intent-tier
  annotations:
    description: VITE_* URLs consumed by docker/ui-build-and-serve.sh for the UI

data:
  # Supervisor HTTP surface base (contracts/supervisor-http.md)
  VITE_SUPERVISOR_API_URL: "http://supervisor.agentic-netops-agents.svc:9090"
  # Worker endpoints are not called directly from the UI in this feature, but
  # exposing the stable Service DNS names as defaults keeps parity with the
  # subject and supports future diagnostics-only calls if added.
  VITE_MAPPER_API_URL: "http://mapper.agentic-netops-agents.svc:9092"
  VITE_ALLOCATOR_API_URL: "http://allocator.agentic-netops-agents.svc:9091"
  VITE_DEPLOYER_API_URL: "http://deployer.agentic-netops-agents.svc:9093"
