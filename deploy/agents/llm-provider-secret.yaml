# Creation-only declaration. scripts/lib/intent_tier.sh applies this file only
# when Secret/llm-provider does not exist, then populates it from host
# environment variables without writing credential values to the repository.
apiVersion: v1
kind: Secret
metadata:
  name: llm-provider
  namespace: agentic-netops-agents
  labels:
    agentic-netops.owner: agentic-netops
    agentic-netops.io/tier: intent
  annotations:
    agentic-netops.io/populated-by: "provision-time (LLM provider credentials; never committed)"
type: Opaque
