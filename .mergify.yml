# Mergify: queue and squash-merge every pull request into main as soon as all
# CI jobs are green. Keep a PR in draft or label it `do-not-merge` to hold it.
# The head branch is deleted by the repository's "delete branch on merge"
# setting, not by Mergify.
queue_rules:
  - name: default
    merge_method: squash
    queue_conditions:
      - base = main
      - -draft
      - -conflict
      - label != do-not-merge
      - check-success = build-and-test
      - check-success = python-tier (openai/gpt-4o-mini)
      - check-success = python-tier (anthropic/claude-3-haiku)
      - check-success = ui
      - check-success = no-credential-literals
      - check-success = tier-absent-gates
      - check-success = lifecycle-idempotence

# Enqueue automatically instead of waiting for the "Queue this pull request"
# checkbox or `@mergifyio queue`.
merge_protections_settings:
  auto_merge_conditions: true
