# T204-T206 tier service: the ip-vrf construct (VRF + L3VNI + Type-5).
apiVersion: network.kubenet.dev/v1alpha1
kind: Network
metadata:
  name: p4-svc-ipvr
  namespace: agentic-netops-intent
spec:
  routers:
    - name: p4-svc-ipvr
      l3vni: 13521
      rd: "65000:21"
      routeTargets:
        import: ["65000:21"]
        export: ["65000:21"]
      prefixes:
        - "10.201.0.0/24"
  attachments:
    - node: leaf01
      attachment: wan1
      vrf: p4-svc-ipvr
    - node: leaf02
      attachment: wan1
      vrf: p4-svc-ipvr
