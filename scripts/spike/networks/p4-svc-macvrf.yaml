# T198-T200 tier service: the mac-vrf construct (VLAN + L2VNI + EVPN RTs).
apiVersion: network.kubenet.dev/v1alpha1
kind: Network
metadata:
  name: p4-svc-macvrf
  namespace: agentic-netops-intent
spec:
  bridgeDomains:
    - name: p4-svc-macvrf
      vlan: 3601
      l2vni: 13511
      evpn:
        routeTargets:
          import: ["65000:13511"]
          export: ["65000:13511"]
  attachments:
    - node: leaf01
      attachment: eth3
      vlan: 3601
    - node: leaf02
      attachment: eth3
      vlan: 3601
