# AGNTCY multi-agent intent tier — feature 002 (002-agntcy-intent-tier).
#
# This is the project root for the Python agent tier. The layout mirrors the
# subject's read-only reference tree (see agents/README.md): `common/`,
# `config/`, `provisioning/`, `supervisors/`, and `tests/` are the importable
# top-level packages of this project (uv runs with this directory as the root).
#
# The pins below are the feature's fidelity contract (research.md Decision 1):
# they reproduce the subject's stack at its pinned versions, on Python 3.13.
# Do not upgrade the exact-pinned packages without a recorded decision.

[project]
name = "ainetops-agents"
version = "0.1.0"
description = "AGNTCY multi-agent intent tier: LangGraph supervisor + mapper/allocator/deployer workers over A2A on SLIM"
requires-python = ">=3.13,<4.0"
dependencies = [
    # --- AGNTCY / A2A pins (fidelity contract; research.md Decision 1) ---
    "agntcy-app-sdk==0.4.5",
    "a2a-sdk==0.3.0",
    "agntcy-identity-service-sdk==0.0.7",
    # --- Model / orchestration pins ---
    "litellm[proxy]==1.75.3",
    "langgraph>=0.4.1",
    "langgraph-supervisor",
    "langchain-litellm>=0.3.0",
    "langgraph-checkpoint-sqlite",
    # --- Runtime / API pins ---
    "pydantic>=2.11.4",
    "fastapi>=0.115.12",
    "uvicorn>=0.29.0",
    "starlette",
    "ioa-observe-sdk==1.0.24",
]

[dependency-groups]
dev = [
    "ruff>=0.5.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
]

# The agent tier is an application, not an installable library: uv manages the
# environment from this pyproject + uv.lock without building the project itself.
[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
# `agents/` is the project root and the import root (common, config,
# provisioning, supervisors, tests).
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
# e2e tests are cluster-gated (they need kubectl + the kind cluster with
# deploy/agents/namespace-rbac.yaml applied); run them explicitly with
# `pytest -m e2e`. The default run (CI included) executes the rest.
addopts = "-ra -m \"not e2e\""
markers = [
    "e2e: cluster-gated end-to-end tests (require a live kind cluster)",
]
