apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: srv6services.ainetops.io
spec:
  group: ainetops.io
  scope: Namespaced
  names:
    kind: SRv6Service
    listKind: SRv6ServiceList
    plural: srv6services
    singular: srv6service
    shortNames: [srv6svc]
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources:
      status: {}
    additionalPrinterColumns:
    - name: Ready
      type: string
      jsonPath: .status.conditions[?(@.type=="Ready")].status
    - name: Degraded
      type: string
      jsonPath: .status.conditions[?(@.type=="Degraded")].status
    - name: Age
      type: date
      jsonPath: .metadata.creationTimestamp
    schema:
      openAPIV3Schema:
        type: object
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            type: object
            required: [attachments, topologyRef, locatorPrefix, vrf, path, client, server, servicePrefix, underlay]
            properties:
              attachments:
                type: array
                minItems: 2
                maxItems: 2
                items:
                  type: object
                  required: [node, interface]
                  properties:
                    node:
                      type: string
                      minLength: 1
                    interface:
                      type: string
                      minLength: 1
              topologyRef:
                type: string
                minLength: 1
              locatorPrefix:
                type: string
                pattern: ^([0-9a-fA-F:]+)/[0-9]+$
              vrf:
                type: string
                minLength: 1
              path:
                type: object
                required: [primary]
                properties:
                  primary:
                    type: string
                    minLength: 1
                  alternate:
                    type: string
              client:
                type: object
                required: [name, ip]
                properties:
                  name:
                    type: string
                  ip:
                    type: string
                    pattern: ^([0-9a-fA-F:]+)/[0-9]+$
              server:
                type: object
                required: [name, ip]
                properties:
                  name:
                    type: string
                  ip:
                    type: string
                    pattern: ^([0-9a-fA-F:]+)/[0-9]+$
              servicePrefix:
                type: string
                pattern: ^([0-9a-fA-F:]+)/[0-9]+$
              transitWaypoints:
                type: array
                items:
                  type: string
              underlay:
                type: string
                enum: [ipv6]
            x-kubernetes-validations:
            - rule: "self.client.name != self.server.name"
              message: client and server endpoints must be distinct
            - rule: "size(self.attachments) == 2"
              message: exactly two attachments are required
            - rule: "self.attachments[0].node != self.attachments[1].node"
              message: attachments must be unique by node
            - rule: "int(self.locatorPrefix.split('/')[1]) >= 48 && int(self.locatorPrefix.split('/')[1]) <= 64"
              message: locator length must be /48-/64
            - rule: "int(self.servicePrefix.split('/')[1]) >= 64 && int(self.servicePrefix.split('/')[1]) <= 96"
              message: service prefix must be /64-/96
          status:
            type: object
            properties:
              observedGeneration:
                type: integer
                format: int64
              conditions:
                type: array
                items:
                  type: object
                  required: [type, status, lastTransitionTime, reason]
                  properties:
                    type:
                      type: string
                    status:
                      type: string
                    lastTransitionTime:
                      type: string
                      format: date-time
                    reason:
                      type: string
                    message:
                      type: string
              configHashes:
                type: object
                additionalProperties:
                  type: string
              activePath:
                type: string
    preserveUnknownFields: false
