apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agentic-netops-sonic-provider
  namespace: agentic-netops-system
rules:
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch"]
- apiGroups: ["network.kubenet.dev"]
  resources: ["networkdevices", "networkdevices/status"]
  verbs: ["get", "list", "watch", "patch", "update"]
- apiGroups: ["sdc.sdcio.dev"]
  resources: ["configs", "configs/status"]
  verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agentic-netops-srv6-controller
  namespace: agentic-netops-system
rules:
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch"]
- apiGroups: ["agentic-netops.io"]
  resources: ["srv6services", "srv6services/status"]
  verbs: ["get", "list", "watch", "patch", "update"]
